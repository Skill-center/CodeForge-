name: CI

# One workflow for every push. Every run builds and tests; a run whose head
# commit carries [phase-gate] (or a manual run with the phase_gate input)
# adds the phase gate: the emulator gate and the runtime gates, in parallel
# with the rest. They were phase-gate.yml until Phase 4 W6.

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      phase_gate:
        description: Run the phase gate too (about 50 minutes)
        type: boolean
        default: false

permissions:
  contents: write

# Runs on a branch queue one after another, plain runs and gate runs in
# separate queues: a push never waits behind a gate, and two gates never
# overlap (each commits its evidence back, and the newer must land last).
# The test is the gate jobs' own condition, repeated: a job's if: cannot
# read a workflow-level value.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && inputs.phase_gate) ||
    (github.event_name == 'push' &&
    contains(github.event.head_commit.message, '[phase-gate]'))) &&
    'phase-gate' || 'ci' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION_FILE: .flutter-version

jobs:
  editor:
    name: Editor page (TypeScript + CodeMirror 6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_COLOR: "1"
    defaults:
      run:
        working-directory: editor
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      # Same pattern as the Flutter job: each check records its output in
      # editor-results/ and may fail on its own, so one run reports every
      # problem; the Flutter job commits the results back in bootstrap mode.
      - name: Install from the lockfile
        id: install
        continue-on-error: true
        run: |
          mkdir -p ../editor-results
          { echo "node $(node --version), npm $(npm --version)"; npm ci --no-audit --no-fund; } 2>&1 | tee ../editor-results/install.txt

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee ../editor-results/typecheck.txt

      - name: Unit + contract tests (vitest)
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx vitest run 2>&1 | tee ../editor-results/test.txt

      # The licences, and since Phase 4 W7 THIRD_PARTY_NOTICES.md's list of
      # the bundle's packages (tool/notices.mjs), current with the lockfile.
      - name: Licence gate (runtime packages)
        id: licenses
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          { node tool/check_licenses.mjs && node tool/notices.mjs --check; } 2>&1 \
            | tee ../editor-results/licenses.txt

      - name: Build the editor page
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node tool/build.mjs 2>&1 | tee ../editor-results/build.txt
          cp ../app/assets/editor/manifest.json ../editor-results/manifest.json

      - name: Verify the built page
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node tool/verify_bundle.mjs 2>&1 | tee ../editor-results/verify.txt

      # The terminal page (Phase 5 W3): xterm.js, built and verified the same
      # way (tool/build_terminal.mjs, tool/verify_terminal.mjs: CSP hash,
      # nothing external, manifest, budget, and a protocol round trip with
      # the real xterm.js).
      - name: Build the terminal page
        id: build_terminal
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node tool/build_terminal.mjs 2>&1 | tee ../editor-results/build_terminal.txt
          cp ../app/assets/terminal/manifest.json ../editor-results/terminal_manifest.json

      - name: Verify the terminal page
        id: verify_terminal
        if: steps.build_terminal.outcome == 'success'
        continue-on-error: true
        run: node tool/verify_terminal.mjs 2>&1 | tee ../editor-results/verify_terminal.txt

      - name: Upload editor results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-results
          path: editor-results/
          if-no-files-found: ignore

      - name: Upload editor page
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: editor-page
          path: app/assets/editor/
          if-no-files-found: error

      - name: Upload terminal page
        if: steps.build_terminal.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: terminal-page
          path: app/assets/terminal/
          if-no-files-found: error

      - name: Enforce editor gates
        if: always()
        run: |
          fail=0
          for gate in "install=${{ steps.install.outcome }}" "typecheck=${{ steps.typecheck.outcome }}" \
                      "tests=${{ steps.tests.outcome }}" "licenses=${{ steps.licenses.outcome }}" \
                      "build=${{ steps.build.outcome }}" "verify=${{ steps.verify.outcome }}" \
                      "build_terminal=${{ steps.build_terminal.outcome }}" \
                      "verify_terminal=${{ steps.verify_terminal.outcome }}"; do
            echo "$gate"
            [ "${gate#*=}" = "success" ] || fail=1
          done
          exit $fail

  quality-and-build:
    name: Quality gates + Android build
    # Runs after the editor job even when it fails, so a bootstrap run still
    # commits the editor results back.
    needs: editor
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Flutter as .flutter-version pins it. flutter-action reads a version
      # file only as a pubspec (environment: flutter:) or an FVM file: given
      # .flutter-version it found no version and installed the latest
      # stable. That was the pinned 3.47.9 until Flutter 3.50.0 reached the
      # stable channel, whose minimum Android Gradle Plugin was above ours
      # then: debug builds failed on the runners that got it (2026-11-11).
      # The file is read here and passed as the version, and the next step
      # fails if another Flutter was installed.
      - name: Read the Flutter pin
        id: flutter_pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < "$FLUTTER_VERSION_FILE")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version | tee "$RUNNER_TEMP/flutter-version.txt"
          actual=$(awk '/^Flutter / { print $2; exit }' "$RUNNER_TEMP/flutter-version.txt")
          want="${{ steps.flutter_pin.outputs.version }}"
          mkdir -p ci-results
          echo "flutter=$actual pinned=$want" | tee ci-results/flutter.txt
          echo "::notice title=Flutter::$actual (pinned: $want)"
          if [ "$actual" != "$want" ]; then
            echo "::error title=Flutter pin::Flutter $actual was installed; .flutter-version pins $want."
            exit 1
          fi

      # The editor page is built from editor/ and never committed
      # (docs/REPOSITORY_STRUCTURE.md): the app bundles exactly what the
      # editor job just built and verified. Without it the tests and the
      # build fail, so its absence is also reported as a gate of its own.
      - name: Fetch the editor page
        id: editor_page
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: editor-page
          path: app/assets/editor

      # The terminal page (Phase 5 W3), the same way.
      - name: Fetch the terminal page
        id: terminal_page
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: terminal-page
          path: app/assets/terminal

      # Captured so a failed resolution still reaches the diagnostics
      # commit (bootstrap) and the job summary.
      - name: Resolve dependencies
        run: |
          mkdir -p ci-results
          flutter pub get 2>&1 | tee ci-results/pub-get.txt
          exit "${PIPESTATUS[0]}"

      # ── Bootstrap mode ────────────────────────────────────────────────
      # A commit whose message contains [bootstrap] asks CI to generate the
      # artifacts that cannot be produced in the authoring sandbox (no Dart
      # SDK there): pubspec.lock, generated code, dart fix/format results,
      # golden baselines. Results are committed back with [skip ci]; THIS run
      # then validates the fixed tree, so the run itself is the evidence.

      # Drift's database code, migration steps, schema dumps and migration-
      # test helpers (Phase 2 W5, ADR-0008), generated before fix + format.
      # make-migrations writes the steps file and the test helpers only once
      # a second schema version exists; `schema generate` writes the helpers
      # for every dumped version, the first included. Then Pigeon's Dart
      # client and Kotlin interface for the storage broker (Phase 3 W2,
      # pigeons/storage_api.dart). Every run regenerates all of it under
      # "Generated code check" and fails if the committed copies are stale.
      # Logged, and allowed to fail so the diagnostics commit still carries
      # what went wrong.
      - name: Bootstrap — generate code
        if: contains(github.event.head_commit.message, '[bootstrap]')
        continue-on-error: true
        run: |
          status=0
          {
            dart run build_runner build \
              && dart run drift_dev make-migrations \
              && dart run drift_dev schema generate drift_schemas/app/ \
                test/drift/app/generated/ \
              && dart run pigeon --input pigeons/storage_api.dart \
              && dart run pigeon --input pigeons/runtime_api.dart \
              && dart run pigeon --input pigeons/search_api.dart \
              && dart run pigeon --input pigeons/terminal_api.dart
          } > ci-results/codegen-bootstrap.txt 2>&1 || status=$?
          tail -40 ci-results/codegen-bootstrap.txt
          exit "$status"

      # Flutter 3.50 deprecates the framework's Material library (Phase 4
      # W1). The migrate_design_widgets fix moves imports of
      # package:flutter/material.dart to package:material_ui/material_ui.dart
      # (the app declares material_ui itself, pinned, so the fix adds no
      # dependency). The plain passes apply every other fix and sort the
      # moved imports: dart fix organizes a file's imports only in a pass that
      # has no other fix for that file, hence two.
      - name: Bootstrap — dart fix + format
        if: contains(github.event.head_commit.message, '[bootstrap]')
        run: |
          dart fix --apply --code=migrate_design_widgets
          dart fix --apply
          dart fix --apply
          dart format .

      - name: Bootstrap — commit lockfile + fixes back
        if: contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): bootstrap lockfile, fixes, format [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      - name: Bootstrap — generate golden baselines
        if: contains(github.event.head_commit.message, '[bootstrap]')
        # Only the golden suites (the full suite runs once, under Tests),
        # bounded so a hung test cannot hold the job until its timeout, and
        # logged so the diagnostics commit carries what happened.
        run: |
          mkdir -p ci-results
          status=0
          timeout --kill-after=30s 10m flutter test --update-goldens \
            --reporter expanded test/goldens > ci-results/goldens.txt 2>&1 \
            || status=$?
          echo "golden generation exited with status $status"

      - name: Bootstrap — commit goldens back
        if: contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): golden baselines [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      # ── Quality gates ─────────────────────────────────────────────────
      # Each gate captures its full output to ci-results/ and is allowed to
      # fail independently so a single run reports ALL problems. In bootstrap
      # mode the diagnostics are committed back (log download hosts are not
      # reachable from the authoring sandbox). A final step enforces the gates.
      - name: Prepare diagnostics dir
        run: mkdir -p ci-results

      - name: Fetch editor results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: editor-results
          path: app/ci-results/editor

      - name: Lockfile drift check
        id: lockfile
        continue-on-error: true
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock > ci-results/lockfile.txt 2>&1

      # Regenerates the Drift and Pigeon output exactly as bootstrap does
      # (generate, then the SDK formatter) and fails if a generator fails or
      # the committed copies differ — including a schema changed without a
      # new schema version, which make-migrations refuses.
      - name: Generated code check
        id: codegen
        continue-on-error: true
        run: |
          status=0
          {
            dart run build_runner build \
              && dart run drift_dev make-migrations \
              && dart run drift_dev schema generate drift_schemas/app/ \
                test/drift/app/generated/ \
              && dart run pigeon --input pigeons/storage_api.dart \
              && dart run pigeon --input pigeons/runtime_api.dart \
              && dart run pigeon --input pigeons/search_api.dart \
              && dart run pigeon --input pigeons/terminal_api.dart \
              && dart format $(find lib -name '*.g.dart' -o -name '*.steps.dart') \
                test/drift/app/generated
          } > ci-results/codegen.txt 2>&1 || status=$?
          generated=(-- '*.g.dart' '*.g.kt' '*.steps.dart' drift_schemas test/drift)
          {
            echo "--- generators exited with status $status"
            echo "--- generated files that differ from the commit:"
            git status --porcelain "${generated[@]}"
          } >> ci-results/codegen.txt
          tail -20 ci-results/codegen.txt
          [ "$status" -eq 0 ] && test -z "$(git status --porcelain "${generated[@]}")"

      - name: Format check
        id: format
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed . > ci-results/format.txt 2>&1

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze > ci-results/analyze.txt 2>&1

      - name: Architecture import lint
        id: imports
        continue-on-error: true
        run: dart run tool/lint_imports.dart > ci-results/imports.txt 2>&1

      # The licences, and since Phase 4 W7 THIRD_PARTY_NOTICES.md's list of
      # the packages linked into the app: a [bootstrap] run writes it (and the
      # diagnostics commit takes it back), every other run checks it.
      - name: Dependency license gate
        id: licenses
        continue-on-error: true
        env:
          BOOTSTRAP: ${{ contains(github.event.head_commit.message, '[bootstrap]') }}
        run: |
          mode=""
          if [ "$BOOTSTRAP" = "true" ]; then mode="--write-notices"; fi
          dart run tool/check_licenses.dart $mode > ci-results/licenses.txt 2>&1

      - name: Tests (with coverage)
        id: tests
        continue-on-error: true
        # Bounded: a test that spins (where no per-test timeout can fire)
        # fails the gate in minutes, with the output up to that point.
        run: |
          timeout --kill-after=30s 15m flutter test --coverage \
            --reporter expanded > ci-results/test.txt 2>&1

      - name: Test digest
        if: steps.tests.outcome == 'failure'
        # Check-run annotations are readable through the API even where the
        # log hosts are not: carry the end of the test output there.
        run: |
          tail -n 40 ci-results/test.txt \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/digest.txt"
          echo "::warning title=Tests failed (last 40 lines)::$(cat "$RUNNER_TEMP/digest.txt")"

      # Golden diff images (Phase 3 W6, an owner item): a golden test that
      # failed left its golden, its own drawing and their differences in a
      # failures/ folder beside it. They move to ci-results/golden-failures/
      # (tool/ci/collect_golden_failures.sh) and are committed back with the
      # diagnostics, on any commit: the bootstrap commit-back takes them
      # with everything else, and "Commit golden failures back" below does
      # it for the others.
      - name: Collect golden failures
        id: golden_failures
        if: always()
        run: |
          count=$(bash tool/ci/collect_golden_failures.sh test ci-results)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "golden failure images: $count"
          if [ "$count" != "0" ]; then
            echo "::warning title=Golden failures::$count images in app/ci-results/golden-failures/ ($(paste -sd' ' ci-results/golden-failures.txt))"
          fi

      # The Gradle distribution: cached between runs, and fetched with
      # retries when the cache has none, because services.gradle.org stalls
      # now and then (app/tool/ci/fetch_gradle.sh). A failed fetch fails
      # the build below, which Enforce reports.
      - name: Restore the Gradle distribution
        id: gradle-dist
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch Gradle
        id: fetch-gradle
        continue-on-error: true
        run: bash tool/ci/fetch_gradle.sh > ci-results/gradle-fetch.txt 2>&1

      - name: Save the Gradle distribution
        if: >-
          steps.gradle-dist.outputs.cache-hit != 'true' &&
          steps.fetch-gradle.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: flutter build apk --debug > ci-results/build.txt 2>&1

      # The runner and, when the build failed, why: annotations are readable
      # through the API where the log hosts are not. Builds of commits that
      # changed only docs failed here on 2026-11-11 without a word of why,
      # until this digest showed Flutter 3.50.0 refusing our Android Gradle
      # Plugin (see "Read the Flutter pin").
      - name: Build digest
        if: always()
        run: |
          image="${ImageOS:-unknown} ${ImageVersion:-}"
          disk=$(df -h / | awk 'NR == 2 { print $4 " free of " $2 }')
          memory=$(free -m | awk '/^Mem:/ { print $7 " MiB available of " $2 }')
          echo "::notice title=Runner::image $image; disk $disk; memory $memory"
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            {
              echo "image $image; disk $disk; memory $memory"
              grep -n -A 12 -E 'What went wrong|No space left|Killed|OutOfMemory|FAILURE:' \
                ci-results/build.txt | head -n 30
              echo '--- the last 25 lines:'
              tail -n 25 ci-results/build.txt
            } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/build-digest.txt"
            echo "::warning title=Debug build failed::$(cat "$RUNNER_TEMP/build-digest.txt")"
          fi

      - name: APK checksum + size
        if: steps.build.outcome == 'success'
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c%s "$apk")
          {
            echo "apk_sha256=$sha"
            echo "apk_bytes=$size"
          } | tee ci-results/apk.txt
          {
            echo "apk_sha256=$sha"
            echo "apk_bytes=$size"
          } >> "$GITHUB_STEP_SUMMARY"

      # The merged manifest (Phase 3 W6, G8): no storage permission, and
      # ADR-0012's backup attributes (tool/ci/check_manifest.py, which first
      # shows itself catching each kind of drift). The debug manifest holds
      # everything the release one does, and the debug-only INTERNET.
      - name: Manifest check
        id: manifest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          status=0
          { python3 tool/ci/check_manifest.py --self-test \
              && python3 tool/ci/check_manifest.py build/app debug; } \
            > ci-results/manifest.txt 2>&1 || status=$?
          cat ci-results/manifest.txt
          exit "$status"

      # The testlab job's scripts prove themselves on every push, so that a
      # change to them is green in plain CI before a commit spends a Test Lab
      # run on it (the owner's rule, 2026-11-17; BUILD_AND_RELEASE §4). Since
      # Phase 4 W5 that includes gate_results.py, which judges the runtime
      # gates' runs, the emulator legs' and Test Lab's alike.
      - name: Test Lab scripts
        id: testlab_scripts
        continue-on-error: true
        run: |
          status=0
          { python3 tool/ci/testlab_device.py --self-test \
              && python3 tool/ci/testlab_diagnose.py --self-test \
              && python3 tool/ci/gate_results.py --self-test; } \
            > ci-results/testlab-scripts.txt 2>&1 || status=$?
          cat ci-results/testlab-scripts.txt
          exit "$status"

      # The release workflow's signer check proves itself on every push, so a
      # change to it is green here before a release run spends a build on it
      # (Phase 5 W1; its first case is the pipe race that failed CI
      # 44394419519's bundle check).
      - name: Release scripts
        id: release_scripts
        continue-on-error: true
        run: |
          status=0
          bash tool/ci/check_signer.sh --self-test > ci-results/release-scripts.txt 2>&1 || status=$?
          cat ci-results/release-scripts.txt
          exit "$status"

      # What minSdk 26 promises (Phase 4 W5, ADR-0007): every method, field
      # and class that CodeForge's own and vendored code refers to in the
      # debug APK's dex, against the SDK's API database. One newer than API
      # 26 passes only behind a version check or in vendored code the app
      # never calls, both named in the script (tool/ci/check_api_floor.py).
      # W5 found t1's RuntimeManifest reading with InputStream.readAllBytes
      # (API 33), which made every runtime install fail on Android 8.0 to
      # 12L; nothing at build time had said so.
      - name: API floor (minSdk 26)
        id: api_floor
        continue-on-error: true
        run: |
          python3 tool/ci/check_api_floor.py --self-test
          python3 tool/ci/check_api_floor.py --apk build/app/outputs/flutter-apk/app-debug.apk \
            --out ci-results/api-floor.txt
          head -n 2 ci-results/api-floor.txt >> "$GITHUB_STEP_SUMMARY"

      # The host's Kotlin unit tests (src/test; Phase 3 W1: the backup
      # policy and its rules files; Phase 4 W3: the runtime host). After the
      # APK build, which wrote android/local.properties and fetched what
      # Gradle needs. The JUnit counts go to ci-results and the summary, so
      # no log download is needed, and a run that found no tests fails. The
      # runtime's instrumented tests (src/androidTest) run in the phase
      # gate; their APK is built here, so a compile error shows on every push.
      - name: Kotlin unit tests
        id: kotlin_tests
        continue-on-error: true
        run: |
          status=0
          ( cd android && timeout --kill-after=30s 15m \
              ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest --console=plain ) \
            > ci-results/kotlin-tests.txt 2>&1 || status=$?
          tests=0; failures=0; errors=0; skipped=0
          for f in build/app/test-results/testDebugUnitTest/TEST-*.xml; do
            [ -f "$f" ] || continue
            head=$(grep -o '<testsuite [^>]*>' "$f" | head -n 1)
            t=$(printf '%s' "$head" | sed -n 's/.* tests="\([0-9]*\)".*/\1/p')
            fl=$(printf '%s' "$head" | sed -n 's/.* failures="\([0-9]*\)".*/\1/p')
            e=$(printf '%s' "$head" | sed -n 's/.* errors="\([0-9]*\)".*/\1/p')
            sk=$(printf '%s' "$head" | sed -n 's/.* skipped="\([0-9]*\)".*/\1/p')
            tests=$((tests + ${t:-0}))
            failures=$((failures + ${fl:-0}))
            errors=$((errors + ${e:-0}))
            skipped=$((skipped + ${sk:-0}))
          done
          summary="kotlin_tests=$tests failures=$failures errors=$errors skipped=$skipped gradle_exit=$status"
          echo "$summary" | tee -a ci-results/kotlin-tests.txt >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] && [ "$tests" -gt 0 ] \
            && [ "$failures" -eq 0 ] && [ "$errors" -eq 0 ]

      - name: Kotlin digest
        if: steps.kotlin_tests.outcome == 'failure'
        run: |
          {
            df -h / | awk 'NR == 2 { print "disk " $4 " free of " $2 }'
            grep -n -A 12 -E 'What went wrong|No space left|FAILED' \
              ci-results/kotlin-tests.txt | head -n 30
            echo '--- the last 15 lines:'
            tail -n 15 ci-results/kotlin-tests.txt
          } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/kotlin-digest.txt"
          echo "::warning title=Kotlin unit tests failed::$(cat "$RUNNER_TEMP/kotlin-digest.txt")"

      # The vendored sealed-runtime kernel's JUnit tests (Phase 4 W2, gate G2):
      # t1's tests, changed only in their package and by recorded patches
      # (native/PROVENANCE.md; the runtime job's provenance check proves it;
      # one test more since Phase 4 W7's patch), on the JVM with no Android
      # SDK. The module is included by app/android/settings.gradle.kts, and
      # nothing depends on it before W3. Counted from the JUnit XML like the
      # Kotlin tests; a run that found no tests fails.
      - name: Sealed runtime tests
        id: sealed_runtime_tests
        continue-on-error: true
        run: |
          status=0
          ( cd android && timeout --kill-after=30s 10m \
              ./gradlew :native:sealed-runtime:test --console=plain ) \
            > ci-results/sealed-runtime-tests.txt 2>&1 || status=$?
          tests=0; failures=0; errors=0; skipped=0
          for f in build/sealed-runtime/test-results/test/TEST-*.xml; do
            [ -f "$f" ] || continue
            head=$(grep -o '<testsuite [^>]*>' "$f" | head -n 1)
            t=$(printf '%s' "$head" | sed -n 's/.* tests="\([0-9]*\)".*/\1/p')
            fl=$(printf '%s' "$head" | sed -n 's/.* failures="\([0-9]*\)".*/\1/p')
            e=$(printf '%s' "$head" | sed -n 's/.* errors="\([0-9]*\)".*/\1/p')
            sk=$(printf '%s' "$head" | sed -n 's/.* skipped="\([0-9]*\)".*/\1/p')
            tests=$((tests + ${t:-0}))
            failures=$((failures + ${fl:-0}))
            errors=$((errors + ${e:-0}))
            skipped=$((skipped + ${sk:-0}))
          done
          summary="sealed_runtime_tests=$tests failures=$failures errors=$errors skipped=$skipped gradle_exit=$status"
          echo "$summary" | tee -a ci-results/sealed-runtime-tests.txt >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] && [ "$tests" -gt 0 ] \
            && [ "$failures" -eq 0 ] && [ "$errors" -eq 0 ]

      - name: Sealed runtime digest
        if: steps.sealed_runtime_tests.outcome == 'failure'
        run: |
          {
            grep -n -A 12 -E 'What went wrong|FAILED|error:' \
              ci-results/sealed-runtime-tests.txt | head -n 30
            echo '--- the last 15 lines:'
            tail -n 15 ci-results/sealed-runtime-tests.txt
          } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/sealed-digest.txt"
          echo "::warning title=Sealed runtime tests failed::$(cat "$RUNNER_TEMP/sealed-digest.txt")"

      # The runtime's pinned files (Phase 4 W3), for the release build below:
      # a build that targets one ABI carries that ABI's sealed payload, built
      # from runtime/pins.json by native/runtime-core/build.gradle.kts. The
      # runtime job keeps them under the pins' hash; without them the build
      # fetches the pinned files itself, verified, and fails closed.
      - name: Restore the runtime's pinned files
        uses: actions/cache/restore@v6
        with:
          path: runtime/generated/cache
          key: runtime-pins-v1-${{ hashFiles('runtime/pins.json') }}

      # The release build (Phase 4 W1): AOT-compiled Dart, R8 and the release
      # lint, none of which the debug build runs. Flutter 3.50.0's first gate
      # found both failing while every debug check passed: Dart 3.14.0's AOT
      # compiler crashed on one function (dart-lang/sdk#64917), and AGP
      # 9.3.1's lint crashed on JDK 17 (fixed in 9.3.2). One ABI, the
      # emulator's, keeps it short; the phase gate builds the others. Since
      # Phase 4 W3 it carries the x86_64 runtime payload, the shipped shape.
      - name: Build release APK (x86_64)
        id: release_build
        continue-on-error: true
        run: |
          status=0
          timeout --kill-after=30s 20m flutter build apk --release \
            --target-platform android-x64 > ci-results/build-release.txt 2>&1 \
            || status=$?
          if [ "$status" -eq 0 ]; then
            apk=build/app/outputs/flutter-apk/app-release.apk
            echo "release_x64_apk_bytes=$(stat -c%s "$apk")" \
              | tee -a ci-results/apk.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Release build digest
        if: steps.release_build.outcome == 'failure'
        run: |
          {
            grep -n -A 12 -E 'What went wrong|error:|Crash occurred|exited with code|FAILURE:' \
              ci-results/build-release.txt | head -n 40
            echo '--- the last 20 lines:'
            tail -n 20 ci-results/build-release.txt
          } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/release-digest.txt"
          echo "::warning title=Release build failed::$(cat "$RUNNER_TEMP/release-digest.txt")"

      # What the APKs carry of the runtime (Phase 4 W3, G3;
      # tool/ci/check_runtime_apk.py, which first shows itself catching each
      # kind of drift): the release APK holds the x86_64 payload whole, the
      # preload and the probe, one ABI, its native libraries compressed (so
      # Android extracts them); the debug APK, built for two ABIs, holds no
      # payload. The 16 KB page alignment of every native library is
      # reported (runtime/check-page-alignment.py), and required of the
      # libraries this repository builds.
      - name: Runtime in the APKs
        id: runtime_apk
        if: steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          status=0
          {
            python3 tool/ci/check_runtime_apk.py --self-test || status=1
            python3 tool/ci/check_runtime_apk.py build/app/outputs/flutter-apk/app-release.apk \
              --abi x86_64 || status=1
            python3 tool/ci/check_runtime_apk.py build/app/outputs/flutter-apk/app-debug.apk \
              --no-payload || status=1
            python3 ../runtime/check-page-alignment.py build/app/outputs/flutter-apk/app-release.apk \
              --report ci-results/page-alignment.txt --require-compliant || status=1
          } > ci-results/runtime-apk.txt 2>&1
          cat ci-results/runtime-apk.txt
          grep -E '^runtime_apk_check=|^page alignment:' ci-results/runtime-apk.txt \
            >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      # The release build's merged manifest (Phase 4 W7): no permission but
      # INTERNET (since Phase 5 W1: the userland's tools reach the network
      # when the user runs them) and androidx.core's own signature
      # permission. The store listing and the Data safety answers
      # (docs/store/) say exactly that.
      - name: Release manifest
        id: release_manifest
        if: steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          status=0
          python3 tool/ci/check_manifest.py build/app release \
            > ci-results/release-manifest.txt 2>&1 || status=$?
          cat ci-results/release-manifest.txt
          grep -E '^permissions:|^manifest_check=' ci-results/release-manifest.txt \
            | sed 's/^/release /' >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            # Per-layer breakdown (first directory under lib/), so phase
            # targets such as "core/services >= 90%" are checkable.
            # Generated code (Drift's *.g.dart and *.steps.dart) is left out,
            # as it is for analysis: nobody writes it, and its unused
            # accessors would swamp the layer it lives in. The excluded line
            # count is printed so nothing disappears silently.
            awk -F'[:,]' '
              /^SF:/ { f = $2; gen = (f ~ /\.(g|steps)\.dart$/)
                       sub(/^.*lib\//, "", f); n = split(f, part, "/")
                       layer = (n > 1) ? part[1] : "(root)"; next }
              /^DA:/ { if (gen) { excluded++; next }
                       total[layer]++; all++
                       if ($3 > 0) { hit[layer]++; allhit++ } }
              END { printf "line_coverage=%d/%d\n", allhit, all
                    printf "generated_lines_excluded=%d\n", excluded
                    fflush()
                    for (l in total)
                      printf "layer_coverage %s=%d/%d (%.1f%%)\n", l, hit[l], total[l], 100 * hit[l] / total[l] | "sort" }
            ' coverage/lcov.info > ci-results/coverage.txt
            cat ci-results/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Commit diagnostics back (bootstrap only) ──────────────────────
      - name: Commit diagnostics back
        if: always() && contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          # Also set here: the earlier commit-back steps may not have run.
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): gate diagnostics [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      # A commit without [bootstrap] commits nothing back, except the images
      # of golden tests that failed, with the diagnostics they belong to.
      - name: Commit golden failures back
        if: >-
          always() && steps.golden_failures.outputs.count != '' &&
          steps.golden_failures.outputs.count != '0' &&
          !contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A app/ci-results
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): golden failure images [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: codeforge-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore

      - name: Enforce quality gates
        if: always()
        run: |
          fail=0
          for gate in editor_page terminal_page lockfile codegen format analyze imports licenses tests build manifest testlab_scripts release_scripts api_floor kotlin_tests sealed_runtime_tests release_build runtime_apk release_manifest; do
            case "$gate" in
              editor_page) outcome="${{ steps.editor_page.outcome }}" ;;
              terminal_page) outcome="${{ steps.terminal_page.outcome }}" ;;
              lockfile) outcome="${{ steps.lockfile.outcome }}" ;;
              codegen) outcome="${{ steps.codegen.outcome }}" ;;
              format) outcome="${{ steps.format.outcome }}" ;;
              analyze) outcome="${{ steps.analyze.outcome }}" ;;
              imports) outcome="${{ steps.imports.outcome }}" ;;
              licenses) outcome="${{ steps.licenses.outcome }}" ;;
              tests) outcome="${{ steps.tests.outcome }}" ;;
              build) outcome="${{ steps.build.outcome }}" ;;
              manifest) outcome="${{ steps.manifest.outcome }}" ;;
              testlab_scripts) outcome="${{ steps.testlab_scripts.outcome }}" ;;
              release_scripts) outcome="${{ steps.release_scripts.outcome }}" ;;
              api_floor) outcome="${{ steps.api_floor.outcome }}" ;;
              kotlin_tests) outcome="${{ steps.kotlin_tests.outcome }}" ;;
              sealed_runtime_tests) outcome="${{ steps.sealed_runtime_tests.outcome }}" ;;
              release_build) outcome="${{ steps.release_build.outcome }}" ;;
              runtime_apk) outcome="${{ steps.runtime_apk.outcome }}" ;;
              release_manifest) outcome="${{ steps.release_manifest.outcome }}" ;;
            esac
            echo "$gate: $outcome"
            [ "$outcome" = "success" ] || fail=1
          done
          exit $fail

  # The sealed runtime's supply chain (Phase 4 W2, gate G2): the runtime/
  # script tests, native/PROVENANCE.md against the vendored files, the pins,
  # and the pinned bootstrap and packages fetched for both ABIs, failing
  # closed. Python 3 and the runner's zstd are all it needs; no Flutter.
  # The pinned files are cached under the hash of runtime/pins.json, because
  # Termux keeps only the latest versions (runtime/README.md).
  # A commit whose message has [repin] re-resolves the pins against the live
  # repository first. [repin] and [bootstrap] commit the pins, the
  # regenerated notices and runtime/ci-results back; any other commit checks
  # that the notices are current.
  runtime:
    name: Runtime supply chain (pins, scripts, provenance)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CACHE: runtime/generated/cache
      RESULTS: runtime/ci-results
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mode and tools
        id: mode
        env:
          REPIN: ${{ contains(github.event.head_commit.message, '[repin]') }}
          BOOTSTRAP: ${{ contains(github.event.head_commit.message, '[bootstrap]') }}
        run: |
          rm -rf "$RESULTS" && mkdir -p "$RESULTS"
          commit_back=false
          if [ "$REPIN" = true ] || [ "$BOOTSTRAP" = true ]; then commit_back=true; fi
          echo "repin=$REPIN" >> "$GITHUB_OUTPUT"
          echo "commit_back=$commit_back" >> "$GITHUB_OUTPUT"
          { python3 --version; zstd --version
            echo "repin=$REPIN commit_back=$commit_back sha=$GITHUB_SHA"
          } | tee "$RESULTS/tools.txt"

      - name: Script tests
        id: script_tests
        continue-on-error: true
        run: |
          files=0; failed=0; cases=0
          : > "$RESULTS/script-tests.txt"
          for t in runtime/tests/test-*.py; do
            files=$((files + 1))
            if timeout --kill-after=30s 10m python3 "$t" > "$RUNNER_TEMP/one.txt" 2>&1; then
              result=PASS
            else
              result=FAIL; failed=$((failed + 1))
            fi
            echo "$result $t"
            { echo "=== $result $t"; cat "$RUNNER_TEMP/one.txt"; } >> "$RESULTS/script-tests.txt"
            # unittest prints "Ran N tests"; t1's payload test is one end-to-end case.
            n=$(sed -n 's/^Ran \([0-9]*\) tests\{0,1\} in .*/\1/p' "$RUNNER_TEMP/one.txt" | tail -n 1)
            cases=$((cases + ${n:-1}))
          done
          summary="script_test_files=$files cases=$cases failed_files=$failed"
          echo "$summary" | tee -a "$RESULTS/script-tests.txt" >> "$GITHUB_STEP_SUMMARY"
          [ "$files" -gt 0 ] && [ "$failed" -eq 0 ]

      - name: Provenance
        id: provenance
        continue-on-error: true
        run: |
          python3 runtime/provenance.py check 2>&1 | tee "$RESULTS/provenance.txt"
          exit "${PIPESTATUS[0]}"

      - name: Restore the pinned files
        id: pin_cache
        uses: actions/cache/restore@v6
        with:
          path: runtime/generated/cache
          key: runtime-pins-v1-${{ hashFiles('runtime/pins.json') }}

      - name: Re-pin
        id: repin
        if: steps.mode.outputs.repin == 'true'
        continue-on-error: true
        run: |
          status=0
          timeout --kill-after=30s 20m python3 runtime/pins.py resolve --cache "$CACHE" \
            > "$RESULTS/repin.txt" 2>&1 || status=$?
          tail -n 30 "$RESULTS/repin.txt"
          exit "$status"

      - name: Check the pins
        id: pins
        continue-on-error: true
        run: |
          python3 runtime/pins.py check 2>&1 | tee "$RESULTS/pins.txt"
          exit "${PIPESTATUS[0]}"

      # Exactly the pinned files, each verified against its pin. A pinned file
      # the repository no longer has fails here, naming the package (G2).
      - name: Fetch the pinned files
        id: fetch
        continue-on-error: true
        run: |
          status=0
          for arch in aarch64 x86_64; do
            python3 runtime/pins.py bootstrap --arch "$arch" --cache "$CACHE" \
              --out runtime/generated/bootstrap || status=1
            python3 runtime/pins.py fetch --arch "$arch" --cache "$CACHE" \
              --out "runtime/generated/debs/$arch" || status=1
          done > "$RESULTS/fetch.txt" 2>&1
          echo "cache_hit=${{ steps.pin_cache.outputs.cache-hit }} cache_size=$(du -sb "$CACHE" 2>/dev/null | cut -f1)" \
            >> "$RESULTS/fetch.txt"
          grep -v '^fetch ' "$RESULTS/fetch.txt" | tail -n 30
          exit "$status"

      - name: Save the pinned files
        if: steps.fetch.outcome == 'success' && steps.pin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: runtime/generated/cache
          key: runtime-pins-v1-${{ hashFiles('runtime/pins.json') }}

      # G2 against the real server: one pinned package pointed at a version
      # the repository does not have must fail the fetch closed.
      - name: Fail closed against the live repository
        id: fail_closed
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          status=0
          timeout --kill-after=30s 10m python3 runtime/tests/live-fail-closed.py "$CACHE" \
            > "$RESULTS/fail-closed.txt" 2>&1 || status=$?
          cat "$RESULTS/fail-closed.txt"
          exit "$status"

      # Informative in W2 (W3 builds it into the app): the payload each ABI
      # would ship, built by t1's script from exactly the pinned files.
      - name: Build the sealed payloads
        id: payload
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          status=0
          for abi in arm64-v8a x86_64; do
            arch="$abi"; [ "$abi" = arm64-v8a ] && arch=aarch64
            if timeout --kill-after=30s 15m python3 runtime/build-sealed-payload.py \
                --bootstrap "runtime/generated/bootstrap/bootstrap-$arch.zip" --abi "$abi" \
                --deb-dir "runtime/generated/debs/$arch" --out runtime/generated/payload \
                > "$RESULTS/payload-$abi.txt" 2>&1; then
              echo "payload $abi: built"
            else
              status=1; echo "payload $abi: FAILED"
              { echo "--- $abi"; tail -n 15 "$RESULTS/payload-$abi.txt"; } >> "$RESULTS/payload-failures.txt"
            fi
            tail -n 8 "$RESULTS/payload-$abi.txt"
          done
          python3 - <<'PY' | tee "$RESULTS/payload-summary.txt" >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          for path in sorted(glob.glob("runtime/generated/payload/assets/sealed-payload-*.json")):
              report = json.load(open(path))
              print("payload abi=%s executables=%s unique_binaries=%s data_files=%s symlinks=%s "
                    "scripts=%s userland_zip_bytes=%s library_bytes=%s" % (
                        report.get("abi"), report.get("executables"), report.get("uniqueBinaries"),
                        report.get("dataFiles"), report.get("symlinks"), report.get("scripts"),
                        report.get("userlandBytes"), report.get("libraryBytes")))
          PY
          exit "$status"

      # THIRD_PARTY_NOTICES.md's and SOURCE_OFFER.md's generated sections, and
      # since Phase 5 W1 the userland's licence texts for the app's licence
      # page (app/assets/licenses/userland.txt): checked, or in a commit-back
      # run rewritten and committed below.
      - name: Notices
        id: notices
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          mode=--check
          [ "${{ steps.mode.outputs.commit_back }}" = true ] && mode=
          python3 runtime/notices.py --cache "$CACHE" $mode 2>&1 | tee "$RESULTS/notices.txt"
          exit "${PIPESTATUS[0]}"

      - name: Runtime digest
        if: always()
        run: |
          {
            for f in tools script-tests provenance repin pins fetch fail-closed payload-summary notices; do
              [ -f "$RESULTS/$f.txt" ] || continue
              echo "--- $f"
              grep -E '^(Ran |OK|FAILED|PASS|FAIL|=== |provenance:|pins:|fetched |bootstrap |resolved |wrote |live-fail-closed:|payload |notices:|script_test_files|cache_hit|Python|\*\*\* Zstandard)' \
                "$RESULTS/$f.txt" | tail -n 25
            done
          } | tee "$RESULTS/summary.txt"
          for pair in "script_tests:script-tests" "provenance:provenance" "repin:repin" \
                      "pins:pins" "fetch:fetch" "fail_closed:fail-closed" "payload:payload-failures" \
                      "notices:notices"; do
            step="${pair%%:*}"; file="$RESULTS/${pair#*:}.txt"
            case "$step" in
              script_tests) outcome="${{ steps.script_tests.outcome }}" ;;
              provenance) outcome="${{ steps.provenance.outcome }}" ;;
              repin) outcome="${{ steps.repin.outcome }}" ;;
              pins) outcome="${{ steps.pins.outcome }}" ;;
              fetch) outcome="${{ steps.fetch.outcome }}" ;;
              fail_closed) outcome="${{ steps.fail_closed.outcome }}" ;;
              payload) outcome="${{ steps.payload.outcome }}" ;;
              notices) outcome="${{ steps.notices.outcome }}" ;;
            esac
            [ "$outcome" = failure ] && [ -f "$file" ] || continue
            tail -n 20 "$file" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/digest.txt"
            echo "::warning title=Runtime: $step failed::$(cat "$RUNNER_TEMP/digest.txt")"
          done

      - name: Commit the pins, notices and results back
        if: always() && steps.mode.outputs.commit_back == 'true'
        run: |
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A -- runtime/pins.json "$RESULTS" THIRD_PARTY_NOTICES.md SOURCE_OFFER.md \
            app/assets/licenses/userland.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): runtime pins, notices and results [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      - name: Enforce the runtime gates
        if: always()
        run: |
          fail=0
          for gate in script_tests provenance repin pins fetch fail_closed notices; do
            case "$gate" in
              script_tests) outcome="${{ steps.script_tests.outcome }}" ;;
              provenance) outcome="${{ steps.provenance.outcome }}" ;;
              repin) outcome="${{ steps.repin.outcome }}" ;;
              pins) outcome="${{ steps.pins.outcome }}" ;;
              fetch) outcome="${{ steps.fetch.outcome }}" ;;
              fail_closed) outcome="${{ steps.fail_closed.outcome }}" ;;
              notices) outcome="${{ steps.notices.outcome }}" ;;
            esac
            # A re-pin is enforced only when the commit asked for one.
            if [ "$gate" = repin ] && [ "${{ steps.mode.outputs.repin }}" != true ]; then
              continue
            fi
            echo "$gate: $outcome"
            [ "$outcome" = "success" ] || fail=1
          done
          echo "payload (informative until W3): ${{ steps.payload.outcome }}"
          exit $fail

  # Firebase Test Lab: the runtime's arm64 gates (Phase 4 W5: G6, with G3's
  # and G4's arm64 figures and ADR-0008's phone measurement; ADR-0009).
  # Runs only for a pushed commit whose subject line (the message's first
  # line) has [testlab], after the quality job; the tag in the body alone
  # starts the job but stops it at its first step, so that a message which
  # mentions the tag can't spend a test by accident. The owner's rule
  # (2026-11-17, BUILD_AND_RELEASE §4): a change goes out without the tag,
  # and a separate commit (usually empty) carries it once that run is green.
  #
  # It builds the arm64-v8a profile APK (a debug APK until Phase 5 W6),
  # which carries the arm64 payload, with
  # integration_test/sync_modes_test.dart as its Dart entrypoint, and its
  # test APK, then runs the test APK's dev.codeforge.app package on one
  # physical arm64 phone with Android 14 or later, picked by
  # app/tool/ci/testlab_device.py --runtime (a mid-range one first):
  #   runtime.ExecModelTest and runtime.SealedShellTest (t1's, ported: G6),
  #   runtime.RuntimeInstallTest (G3's first install) and
  #   runtime.RuntimeCommandsTest (G4), then
  #   syncmodes.SyncModesTest: the session store's synchronous NORMAL
  #   against FULL (ADR-0008), through integration_test's FlutterTestRunner,
  #   and since Phase 4 W6 search on the gate's 10,000-file project through
  #   the runtime's ripgrep (integration_test/phone_search_test.dart), and
  #   since Phase 5 W6 the terminal's budgets (G6: echo, the 10 MiB flood
  #   with Flutter's frames, memory; xterm.js's DOM renderer and WebGL; the
  #   page composed by Hybrid Composition++ and reached through its
  #   MessagePort, W6's memory work; the memory judged with the terminal
  #   open and idle at its full stop, within 90 MB, and a flood's growth
  #   recorded, the owner's decision of 2026-11-21) and a folder's copy
  #   through Android's picker
  #   (integration_test/phone_terminal_test.dart), whose requests the
  #   instrumentation answers (syncmodes/GateAnswers.java).
  # One matrix on one phone: 1 of the Spark plan's 5 free physical-device
  # tests a day. The JUnit report and the device log come back from Test
  # Lab's results bucket, app/tool/ci/gate_results.py judges them (every
  # class ran, none failed or skipped, the audits 0, the store's timings
  # found), and the evidence goes to app/ci-results/testlab/, committed back
  # with the project id masked. Needs the repository secret
  # FIREBASE_TEST_LAB_KEY (a service account's JSON key; the account needs
  # the Editor role, which Test Lab's default results bucket requires) and
  # FIREBASE_PROJECT_ID, as a repository variable or a repository secret
  # (the variable wins when both are set).
  testlab:
    name: Firebase Test Lab · runtime on a physical arm64 phone
    needs: quality-and-build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[testlab]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      RESULTS: app/ci-results/testlab
      # Never wait on a prompt: a missing API fails with gcloud's message.
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Asked for in the subject line, and connected?
        id: asked
        env:
          KEY_SET: ${{ secrets.FIREBASE_TEST_LAB_KEY != '' }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          case "$subject" in
            *"[testlab]"*) echo "asked=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "The tag is in the message's body, not its subject line: no run, no test used."
              echo "asked=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          rm -rf "$RESULTS" && mkdir -p "$RESULTS"
          missing=""
          [ -n "$PROJECT" ] || missing="$missing FIREBASE_PROJECT_ID (a variable or a secret),"
          [ "$KEY_SET" = true ] || missing="$missing the secret FIREBASE_TEST_LAB_KEY,"
          if [ -n "$missing" ]; then
            echo "not connected: missing${missing%,}" > "$RESULTS/check.txt"
            echo "::error title=Test Lab is not connected::Missing${missing%,} (repository Settings > Secrets and variables > Actions)."
            exit 1
          fi
          python3 app/tool/ci/testlab_device.py --self-test
          python3 app/tool/ci/testlab_diagnose.py --self-test
          python3 app/tool/ci/gate_results.py --self-test

      # The build: as the phase gate's, for arm64 (whose payload goes into a
      # build that targets arm64 alone, android/build.gradle.kts).
      - uses: actions/setup-java@v6
        if: steps.asked.outputs.asked == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Read the Flutter pin
        id: flutter_pin
        if: steps.asked.outputs.asked == 'true'
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: steps.asked.outputs.asked == 'true'
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          channel: stable
          cache: true

      - uses: actions/setup-node@v7
        if: steps.asked.outputs.asked == 'true'
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build the editor page
        if: steps.asked.outputs.asked == 'true'
        working-directory: editor
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run verify

      - name: Resolve dependencies and generate code
        if: steps.asked.outputs.asked == 'true'
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build
          dart run pigeon --input pigeons/storage_api.dart
          dart run pigeon --input pigeons/runtime_api.dart
          dart run pigeon --input pigeons/search_api.dart
          dart run pigeon --input pigeons/terminal_api.dart

      - name: Restore the Gradle distribution
        if: steps.asked.outputs.asked == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch Gradle
        if: steps.asked.outputs.asked == 'true'
        working-directory: app
        run: bash tool/ci/fetch_gradle.sh

      - name: Restore the runtime's pinned files
        if: steps.asked.outputs.asked == 'true'
        uses: actions/cache/restore@v6
        with:
          path: runtime/generated/cache
          key: runtime-pins-v1-${{ hashFiles('runtime/pins.json') }}

      # Flutter's build writes what Gradle needs; then one Gradle run makes
      # the app (-Ptarget: the Dart entrypoint, as Flutter documents for Test
      # Lab) and its test APK, so one debug key signs both, which
      # same_signer.sh checks before a test is spent (two runs signed them
      # with two keys in the runtime gates' first run, 44235180242). Since
      # Phase 5 W6 the app is a profile build (its Dart compiled ahead of time,
      # as it ships, for the terminal's budgets), and the test APK targets it
      # (app/build.gradle.kts: codeforge.testBuildType); until then both were
      # debug builds.
      - name: Build the arm64 APKs
        if: steps.asked.outputs.asked == 'true'
        working-directory: app
        run: |
          mkdir -p ../testlab-apk build/testlab
          entry="$GITHUB_WORKSPACE/app/integration_test/sync_modes_test.dart"
          flutter build apk --profile --target-platform android-arm64 -t "$entry" \
            > build/testlab/build.txt 2>&1 || { tail -n 40 build/testlab/build.txt; exit 1; }
          ( cd android && timeout --kill-after=30s 20m ./gradlew :app:assembleProfile \
              :app:assembleProfileAndroidTest -Pcodeforge.testBuildType=profile \
              -Ptarget-platform=android-arm64 -Ptarget="$entry" \
              --console=plain ) >> build/testlab/build.txt 2>&1 \
            || { tail -n 40 build/testlab/build.txt; exit 1; }
          grep -E 'sealed payload|CodeForge ABIs|Built ' build/testlab/build.txt || true
          cp build/app/outputs/apk/profile/app-profile.apk ../testlab-apk/app-profile.apk
          cp build/app/outputs/apk/androidTest/profile/app-profile-androidTest.apk ../testlab-apk/
          bash tool/ci/same_signer.sh ../testlab-apk/app-profile.apk ../testlab-apk/app-profile-androidTest.apk
          python3 tool/ci/check_runtime_apk.py ../testlab-apk/app-profile.apk --abi arm64-v8a
          ls -l ../testlab-apk

      - name: Authenticate to Google Cloud
        if: steps.asked.outputs.asked == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_KEY }}

      - uses: google-github-actions/setup-gcloud@v3
        if: steps.asked.outputs.asked == 'true'

      # Listing the devices costs no quota, and fails first when the key,
      # its role or the two APIs are not right.
      - name: Pick a physical arm64 phone
        id: device
        if: steps.asked.outputs.asked == 'true'
        run: |
          gcloud --quiet config set project "$PROJECT"
          status=0
          gcloud firebase test android models list --format=json \
            > "$RUNNER_TEMP/models.json" 2> "$RUNNER_TEMP/models.log" || status=$?
          if [ "$status" -ne 0 ]; then
            { echo "models list: exit $status"; tail -n 20 "$RUNNER_TEMP/models.log"; } \
              | tee "$RESULTS/check.txt"
            exit "$status"
          fi
          device=$(python3 app/tool/ci/testlab_device.py "$RUNNER_TEMP/models.json" --list 8 --runtime \
            2> "$RESULTS/device.txt") || { cat "$RESULTS/device.txt"; exit 1; }
          cat "$RESULTS/device.txt"
          echo "device=$device" >> "$GITHUB_OUTPUT"

      # When listing fails: what the key can see, at no cost (no test runs),
      # so that the fix is plain: the key, its account's roles on the project
      # and the two APIs. It prints yes or no for the ids, never the ids.
      - name: Diagnose the connection
        if: failure() && steps.device.outcome == 'failure'
        run: |
          python3 app/tool/ci/testlab_diagnose.py 2>&1 | tee -a "$RESULTS/check.txt"
          echo "testlab: $(grep '^hint=' "$RESULTS/check.txt" | tail -n 1)" >> "$GITHUB_STEP_SUMMARY"

      # The one test this push spends. Its verdict is the judge's, below: a
      # failed matrix still has results to bring back.
      - name: Run the runtime's tests on the phone
        id: run
        if: steps.asked.outputs.asked == 'true'
        env:
          DEVICE: ${{ steps.device.outputs.device }}
        run: |
          status=0
          gcloud firebase test android run --type instrumentation \
            --app testlab-apk/app-profile.apk --test testlab-apk/app-profile-androidTest.apk \
            --device "$DEVICE" --timeout 30m --test-targets "package dev.codeforge.app" \
            --results-history-name codeforge-runtime \
            --results-dir "codeforge-runtime/${{ github.run_id }}-${{ github.run_attempt }}" \
            --format=json > "$RUNNER_TEMP/run.json" 2> "$RUNNER_TEMP/run.log" || status=$?
          case "$status" in
            0) meaning="every test execution passed" ;;
            1) meaning="a general failure (a file, the network, or a permission)" ;;
            10) meaning="a test did not pass" ;;
            15) meaning="Test Lab could not decide pass or fail" ;;
            18) meaning="the device and version are not supported together" ;;
            19) meaning="the test matrix was cancelled" ;;
            20) meaning="a Test Lab infrastructure error" ;;
            *) meaning="see the log" ;;
          esac
          echo "gcloud_exit=$status" >> "$GITHUB_OUTPUT"
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ) run=${{ github.run_id }} sha=${GITHUB_SHA:0:7}"
            echo "app=testlab-apk/app-profile.apk bytes=$(stat -c %s testlab-apk/app-profile.apk)"
            echo "test=testlab-apk/app-profile-androidTest.apk bytes=$(stat -c %s testlab-apk/app-profile-androidTest.apk)"
            echo "device=$DEVICE"
            echo "gcloud_exit=$status ($meaning)"
            echo "--- outcome"
            cat "$RUNNER_TEMP/run.json"
            echo "--- gcloud's log (last 40 lines)"
            tail -n 40 "$RUNNER_TEMP/run.log"
          } > "$RESULTS/check.txt"
          cat "$RESULTS/check.txt"
          echo "testlab: gcloud_exit=$status ($meaning) on $DEVICE" >> "$GITHUB_STEP_SUMMARY"

      # The JUnit report and the device log, from the results bucket that
      # gcloud named (Test Lab's own on the Spark plan; the key's Editor role
      # reads it). Videos and screenshots stay there.
      - name: Fetch the results
        if: always() && steps.run.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          url=$(grep -o 'https://console.developers.google.com/storage/browser/[^] ]*' \
            "$RUNNER_TEMP/run.log" | head -n 1)
          if [ -z "$url" ]; then
            echo "fetch: gcloud named no results bucket" | tee "$RESULTS/fetch.txt"
            exit 0
          fi
          status=0
          gcloud storage rsync --recursive --exclude='.*\.(mp4|png|jpg|webm)$' \
            "gs://${url#https://console.developers.google.com/storage/browser/}" "$RUNNER_TEMP/results" \
            > "$RUNNER_TEMP/fetch.log" 2>&1 || status=$?
          {
            echo "fetch_exit=$status"
            tail -n 6 "$RUNNER_TEMP/fetch.log"
            echo "--- files"
            ( cd "$RUNNER_TEMP/results" && find . -type f -printf '%P %s\n' | sort | head -n 80 )
          } | tee "$RESULTS/fetch.txt"

      - name: Judge the run
        id: judge
        if: always() && steps.run.outcome == 'success'
        env:
          DEVICE: ${{ steps.device.outputs.device }}
          GCLOUD_EXIT: ${{ steps.run.outputs.gcloud_exit }}
        run: |
          found="$RUNNER_TEMP/results"
          args=()
          while IFS= read -r report; do
            args+=(--junit "$report")
          done < <(find "$found" -type f -name 'test_result_*.xml' 2>/dev/null | sort)
          log=$(find "$found" -type f -name logcat -not -path '*/test_cases/*' 2>/dev/null | head -n 1)
          if [ -n "$log" ]; then
            args+=(--figures "$log" --document CODEFORGE_SYNC_JSON "$log")
            args+=(--document CODEFORGE_SEARCH_JSON "$log")
            args+=(--document CODEFORGE_TERMINAL_JSON "$log" --document CODEFORGE_COPY_JSON "$log")
            grep -E 'CodeForgeRuntimeGate|CodeForgeRuntime|CodeForgeSearch|CodeForgeGate|CodeForgePagePort|ExecModel|CODEFORGE_SYNC_JSON|CODEFORGE_SEARCH_JSON|CODEFORGE_TERMINAL_JSON|CODEFORGE_COPY_JSON|RUNTIME_GATE page_|RUNTIME_GATE copy_|phone terminal|phone copy|terminal measure|PlatformViewsChannel|Impeller|FlutterTestRunner|TestRunner|AndroidRuntime' \
              "$log" | tail -n 3000 > "$RESULTS/logcat-runtime.txt" || true
          fi
          python3 app/tool/ci/gate_results.py "${args[@]}" \
            --expect dev.codeforge.app.runtime.ExecModelTest:1 \
            --expect dev.codeforge.app.runtime.SealedShellTest:2 \
            --expect dev.codeforge.app.runtime.RuntimeInstallTest:7 \
            --expect dev.codeforge.app.runtime.RuntimeCommandsTest:6 \
            --expect dev.codeforge.app.runtime.TerminalSessionTest:7 \
            --expect dev.codeforge.app.runtime.SessionServiceTest:4 \
            --expect dev.codeforge.app.syncmodes.SyncModesTest:4 \
            --require exec_model_audit_outside_apk=0 \
            --require audit_outside_apk=0 \
            --require warm_audit_outside_apk=0 \
            --require sealed_shell_audit_outside_apk=0 \
            --require sealed_shell_first_start_audit_outside_apk=0 \
            --require sealed_shell_second_start_audit_outside_apk=0 \
            --require terminal_bash=ok \
            --require terminal_ninth=too_many \
            --require terminal_end_all_left=0 \
            --require terminal_end_all_processes_left=0 \
            --require terminal_flood_whole=1 \
            --require terminal_flood_within_window=1 \
            --require terminal_echo_p95_under_budget=1 \
            --require service_started_with_first=1 \
            --require service_stopped_after_last=1 \
            --require service_end_all_left=0 \
            --require service_end_all_processes_left=0 \
            --require service_end_all_stopped=1 \
            --require service_session_fsize_bytes=4294967296 \
            --require service_session_cpu=unlimited \
            --require service_fsize_enforced=1 \
            --require service_nproc_enforced=1 \
            --require service_nproc_safe=1 \
            --require service_ledger_running_tombstone=system \
            --require service_ledger_exited_tombstone=exit:7 \
            --require page_renderer_shipped=webgl \
            --require page_composition=hcpp \
            --require page_host_port=1 \
            --require page_echo_under_budget=1 \
            --require page_flood_whole=1 \
            --require page_flood_ui_under_budget=1 \
            --require page_memory_open_under_budget=1 \
            --need-document CODEFORGE_SYNC_JSON \
            --need-document CODEFORGE_SEARCH_JSON \
            --need-document CODEFORGE_TERMINAL_JSON \
            --need-document CODEFORGE_COPY_JSON \
            --meta "device=$DEVICE" --meta "gcloud_exit=$GCLOUD_EXIT" \
            --meta "run=${{ github.run_id }}" --meta "sha=${GITHUB_SHA:0:7}" \
            --out-json "$RESULTS/runtime.json" --out-txt "$RESULTS/runtime.txt"

      # The project id is not a credential, but the repository is public, so
      # the committed evidence names it $FIREBASE_PROJECT_ID; the job's log
      # keeps the console link (with the id masked when it is a secret).
      - name: Commit the evidence back
        if: always() && steps.asked.outputs.asked == 'true'
        run: |
          mkdir -p "$RESULTS"
          if [ -n "$PROJECT" ]; then
            find "$RESULTS" -type f \( -name '*.txt' -o -name '*.json' \) \
              -exec sed -i "s/$PROJECT/\$FIREBASE_PROJECT_ID/g" {} +
          fi
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A -- "$RESULTS"
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): Test Lab runtime gates [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

  # ------------------------------------------------------------ phase gate
  # The full phase exit gate (BUILD_AND_RELEASE.md §3): emulator integration
  # tests, process-death restore and the cold-start measurement on API 36,
  # and the runtime gates on API 26 to 36. Only in a run whose head commit
  # carries [phase-gate], or a manual run with the phase_gate input; they
  # need no other job, so they start with the build. Each commits its
  # evidence back on its own (tool/ci/commit_gate_evidence.sh).
  emulator-gate:
    name: Phase gate · emulator (API 36)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.phase_gate) ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[phase-gate]'))
    runs-on: ubuntu-latest
    # About 30 minutes until Phase 4 W3. W3 puts a payload into three builds
    # and adds two parts: the arm64 bundle, and the runtime group (an x86_64
    # payload build, its instrumented tests and an integration pair). The limit
    # leaves room for a slow emulator.
    timeout-minutes: 100
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Flutter as .flutter-version pins it: read here and passed as the
      # version, since flutter-action reads a version file only as a
      # pubspec or an FVM file (ci.yml says more).
      - name: Read the Flutter pin
        id: flutter_pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version | tee "$RUNNER_TEMP/flutter-version.txt"
          actual=$(awk '/^Flutter / { print $2; exit }' "$RUNNER_TEMP/flutter-version.txt")
          want="${{ steps.flutter_pin.outputs.version }}"
          echo "::notice title=Flutter::$actual (pinned: $want)"
          if [ "$actual" != "$want" ]; then
            echo "::error title=Flutter pin::Flutter $actual was installed; .flutter-version pins $want."
            exit 1
          fi

      # The editor page is built from editor/ and never committed. This
      # workflow cannot see the CI run's artifact, so it builds the page from
      # the same lockfile (the build is reproducible: same bytes, same hash)
      # and verifies it before the APK bundles it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build the editor page
        working-directory: editor
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run verify

      - name: Resolve dependencies
        run: flutter pub get

      # Drift's generated database code (Phase 2 W5) and the storage
      # broker's Pigeon API (Phase 3 W2). The gate builds the pushed commit,
      # which on a [bootstrap] push predates CI's commit-back of the
      # generated files; on later commits this reproduces them.
      - name: Generate code
        run: |
          dart run build_runner build
          dart run pigeon --input pigeons/storage_api.dart
          dart run pigeon --input pigeons/runtime_api.dart
          dart run pigeon --input pigeons/search_api.dart
          dart run pigeon --input pigeons/terminal_api.dart

      # The Gradle distribution: cached between runs, and fetched with
      # retries when the cache has none, because services.gradle.org stalls
      # now and then (app/tool/ci/fetch_gradle.sh). Saved right after the
      # fetch, since a cache saved at the end of the job needs the whole
      # gate to pass.
      - name: Restore the Gradle distribution
        id: gradle-dist
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch Gradle
        run: bash tool/ci/fetch_gradle.sh

      - name: Save the Gradle distribution
        if: steps.gradle-dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      # The runtime's pinned files (Phase 4 W3): every build below that
      # targets one ABI carries that ABI's sealed payload, built from them
      # (native/runtime-core/build.gradle.kts). Without the cache the builds
      # fetch the pinned files themselves, verified, and fail closed.
      - name: Restore the runtime's pinned files
        uses: actions/cache/restore@v6
        with:
          path: runtime/generated/cache
          key: runtime-pins-v1-${{ hashFiles('runtime/pins.json') }}

      - name: Build debug APK
        run: |
          flutter build apk --debug
          # `flutter test integration_test` rebuilds app-debug.apk with the
          # test entrypoint, so keep the plain app aside.
          mkdir -p build/gate
          cp build/app/outputs/flutter-apk/app-debug.apk build/gate/app-plain-debug.apk

      # Cold start (G6) is timed on a release build for the emulator ABI; if
      # this step fails the gate falls back to the plain debug APK and says so
      # in ci-results/gate/perf.json.
      # Each of the builds below logs to build/gate/logs/, which goes into
      # the evidence after the gate (the gate starts by clearing
      # ci-results/gate/): W1's first gate on Flutter 3.50.0 lost all three
      # to failures whose reasons were only in the job log.
      - name: Build release APK (x86_64, cold-start measurement)
        continue-on-error: true
        run: |
          mkdir -p build/gate/logs
          set -o pipefail
          flutter build apk --release --target-platform android-x64 2>&1 \
            | tee build/gate/logs/build-release-x64.txt
          cp build/app/outputs/flutter-apk/app-release.apk build/gate/app-release-x64.apk

      # The same release APK rendering with Skia, for the cold-start group to
      # time beside the shipped one (Phase 3 W6: Impeller's first gate timed
      # cold start at 1688 ms, against 755-1372 ms on Skia in earlier gates).
      # The manifest gets Flutter's opt-out for this build only, and is put
      # back at once. Never shipped.
      - name: Build release APK with Skia (x86_64, cold-start comparison)
        continue-on-error: true
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          cp "$manifest" "$RUNNER_TEMP/AndroidManifest.xml"
          status=0
          mkdir -p build/gate/logs
          python3 tool/ci/skia_manifest.py "$manifest" \
            && flutter build apk --release --target-platform android-x64 \
                 > build/gate/logs/build-release-x64-skia.txt 2>&1 \
            && cp build/app/outputs/flutter-apk/app-release.apk \
                 build/gate/app-release-x64-skia.apk || status=$?
          tail -n 25 build/gate/logs/build-release-x64-skia.txt || true
          cp "$RUNNER_TEMP/AndroidManifest.xml" "$manifest"
          git diff --exit-code -- "$manifest"
          exit "$status"

      # Phase 2 W3 engine benchmark pages (CodeMirror 6 + Monaco), built only
      # now: the release APK above stays free of them, while the phone APK
      # and the integration tests below (which rebuild the debug APK) bundle
      # them.
      - name: Build the editor benchmark pages
        working-directory: editor
        run: npm run build:bench

      # The phone test build: profile mode (optimised like release, but
      # debug-signed and with Settings → Developer), arm64, benchmark pages
      # inside. Uploaded below as codeforge-phone-profile-arm64.
      - name: Build phone APK (profile, arm64)
        continue-on-error: true
        run: |
          mkdir -p build/gate/logs
          set -o pipefail
          flutter build apk --profile --target-platform android-arm64 2>&1 \
            | tee build/gate/logs/build-phone-profile-arm64.txt
          cp build/app/outputs/flutter-apk/app-profile.apk build/gate/codeforge-phone-profile-arm64.apk
          sha256sum build/gate/codeforge-phone-profile-arm64.apk

      # The store's shape (Phase 4 W3, G3: sizes recorded, never judged
      # here): a release app bundle for arm64-v8a, the ABI Play serves, with
      # its payload, measured per device against Play's 200 MB base-module
      # limit by t1's runtime/check-bundle-size.py (t1 measured 136.0 MB).
      # The bundle is not kept: it is unsigned for upload (ADR-0010).
      - name: Build app bundle (arm64, per-device size)
        continue-on-error: true
        run: |
          mkdir -p build/gate/logs
          status=0
          flutter build appbundle --release --target-platform android-arm64 \
            > build/gate/logs/build-bundle-arm64.txt 2>&1 || status=$?
          tail -n 15 build/gate/logs/build-bundle-arm64.txt
          if [ "$status" -eq 0 ]; then
            python3 ../runtime/check-bundle-size.py build/app/outputs/bundle/release/app-release.aab \
              --json build/gate/logs/bundle-size.json \
              --apk build/gate/codeforge-phone-profile-arm64.apk \
              2>&1 | tee build/gate/logs/bundle-size.txt
          fi
          exit "$status"

      # What each APK carries of the runtime (tool/ci/check_runtime_apk.py)
      # and the 16 KB alignment of its native libraries: recorded here, and
      # enforced on the x86_64 release APK by ci.yml's "Runtime in the APKs".
      - name: Runtime in the gate's APKs
        continue-on-error: true
        run: |
          mkdir -p build/gate/logs
          {
            for pair in app-release-x64.apk:x86_64 codeforge-phone-profile-arm64.apk:arm64-v8a; do
              apk="build/gate/${pair%%:*}"
              [ -f "$apk" ] || { echo "no $apk"; continue; }
              python3 tool/ci/check_runtime_apk.py "$apk" --abi "${pair##*:}"
              python3 ../runtime/check-page-alignment.py "$apk" | head -n 1
            done
            [ -f build/gate/app-plain-debug.apk ] \
              && python3 tool/ci/check_runtime_apk.py build/gate/app-plain-debug.apk --no-payload
          } 2>&1 | tee build/gate/logs/runtime-apks.txt

      - name: Run emulator gate
        id: gate
        continue-on-error: true
        run: bash tool/ci/emulator_gate.sh

      - name: Keep the build logs
        if: always()
        run: |
          mkdir -p ci-results/gate
          cp build/gate/logs/*.txt build/gate/logs/*.json ci-results/gate/ 2>/dev/null || true
          ls build/gate/logs 2>/dev/null || echo "no build logs"

      # Key evidence also goes out as check-run annotations (readable via the
      # API) in case the commit-back below fails.
      - name: Evidence annotations
        if: always()
        continue-on-error: true
        run: bash tool/ci/annotate_gate_evidence.sh

      # Log/artifact download hosts are unreachable from the authoring
      # sandbox, so commit the gate evidence (app/ci-results/gate/) back.
      - name: Commit gate evidence back
        if: always()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: bash app/tool/ci/commit_gate_evidence.sh "${{ github.ref_name }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Phase gate results"
            echo '```'
            cat ci-results/gate/host.txt 2>/dev/null || true
            cat ci-results/gate/system-image.txt 2>/dev/null || true
            cat ci-results/gate/readiness.txt 2>/dev/null || true
            cat ci-results/gate/attempts.txt 2>/dev/null || true
            cat ci-results/gate/coldstart-summary.txt 2>/dev/null || true
            cat ci-results/gate/editor_bench.txt 2>/dev/null || true
            cat ci-results/gate/large_files.txt 2>/dev/null || true
            cat ci-results/gate/backup.txt 2>/dev/null || true
            cat ci-results/gate/folders.txt 2>/dev/null || true
            cat ci-results/gate/explorer.txt 2>/dev/null || true
            cat ci-results/gate/watch.txt 2>/dev/null || true
            cat ci-results/gate/measure.txt 2>/dev/null || true
            cat ci-results/gate/runtime.txt 2>/dev/null || true
            cat ci-results/gate/search.txt 2>/dev/null || true
            grep -E '^runtime_apk=|^runtime_apk_check=|^page alignment' ci-results/gate/runtime-apks.txt 2>/dev/null || true
            grep -E 'base module|per device|MB' ci-results/gate/bundle-size.txt 2>/dev/null | head -n 6 || true
            cat ci-results/gate/gate-result.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-gate-results
          path: app/ci-results/gate/
          if-no-files-found: ignore

      - name: Upload phone APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeforge-phone-profile-arm64
          path: app/build/gate/codeforge-phone-profile-arm64.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce gate
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "Emulator gate failed — see committed app/ci-results/gate/ evidence."
            exit 1
          fi

  # The runtime gates (Phase 4 W5; G5: API 34 and 36, G7: API 26 to 28 for
  # ADR-0007; ADR-0009's runtime gates). They run beside the emulator gate,
  # so a work package still has one gate. One job builds the debug APK with
  # the x86_64 payload and its test APK, once; each leg boots one API level
  # and runs the runtime's instrumented tests on them, t1's ported
  # ExecModelTest and SealedShellTest with W3's and W4's
  # (tool/ci/runtime_gate_leg.sh); the last job keeps every leg's evidence
  # in app/ci-results/runtime-gates/ and fails the run when a leg failed.
  runtime-build:
    name: Phase gate · runtime build (x86_64 payload)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.phase_gate) ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[phase-gate]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Read the Flutter pin
        id: flutter_pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          actual=$(flutter --version | awk '/^Flutter / { print $2; exit }')
          want="${{ steps.flutter_pin.outputs.version }}"
          if [ "$actual" != "$want" ]; then
            echo "::error title=Flutter pin::Flutter $actual was installed; .flutter-version pins $want."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build the editor page
        working-directory: editor
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run verify

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build
          dart run pigeon --input pigeons/storage_api.dart
          dart run pigeon --input pigeons/runtime_api.dart
          dart run pigeon --input pigeons/search_api.dart
          dart run pigeon --input pigeons/terminal_api.dart

      - name: Restore the Gradle distribution
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch Gradle
        run: bash tool/ci/fetch_gradle.sh

      - name: Restore the runtime's pinned files
        uses: actions/cache/restore@v6
        with:
          path: runtime/generated/cache
          key: runtime-pins-v1-${{ hashFiles('runtime/pins.json') }}

      # The build the main gate's runtime group makes: one ABI, so the
      # x86_64 payload goes in (android/build.gradle.kts). Flutter's build
      # writes what Gradle needs; then one Gradle run makes the app and its
      # test APK, so one debug key signs both (two runs signed them with two
      # keys in the first run of these gates, 44235180242), which
      # same_signer.sh checks before any leg starts.
      - name: Build the APKs
        run: |
          mkdir -p build/runtime-gates
          flutter build apk --debug --target-platform android-x64 > build/runtime-gates/build.txt 2>&1 \
            || { tail -n 40 build/runtime-gates/build.txt; exit 1; }
          ( cd android && timeout --kill-after=30s 20m ./gradlew :app:assembleDebug \
              :app:assembleDebugAndroidTest -Ptarget-platform=android-x64 --console=plain ) \
            >> build/runtime-gates/build.txt 2>&1 || { tail -n 40 build/runtime-gates/build.txt; exit 1; }
          grep -E 'sealed payload|CodeForge ABIs|Built ' build/runtime-gates/build.txt || true
          cp build/app/outputs/apk/debug/app-debug.apk build/runtime-gates/app-debug.apk
          cp build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/runtime-gates/
          bash tool/ci/same_signer.sh build/runtime-gates/app-debug.apk \
            build/runtime-gates/app-debug-androidTest.apk
          python3 tool/ci/check_runtime_apk.py build/runtime-gates/app-debug.apk --abi x86_64
          ls -l build/runtime-gates

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-gates-apks
          path: |
            app/build/runtime-gates/app-debug.apk
            app/build/runtime-gates/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

  runtime-gates:
    name: Phase gate · runtime API ${{ matrix.api }}
    needs: runtime-build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [26, 27, 28, 34, 36]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: runtime-gates-apks
          path: app/build/runtime-gates

      - name: Run the leg
        run: |
          bash tool/ci/runtime_gate_leg.sh "${{ matrix.api }}" \
            build/runtime-gates/app-debug.apk build/runtime-gates/app-debug-androidTest.apk

      - name: Upload the leg's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-gate-api-${{ matrix.api }}
          path: app/ci-results/runtime-gates/
          if-no-files-found: warn
          retention-days: 7

  runtime-gates-evidence:
    name: Phase gate · runtime evidence
    needs: runtime-gates
    if: always() && needs.runtime-gates.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One folder per artifact: each leg's own evidence is taken from its
      # own artifact, never from another's copy.
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-gate-api-*
          path: legs

      - name: Summary
        run: |
          dir=app/ci-results/runtime-gates
          rm -rf "$dir" && mkdir -p "$dir"
          for api in 26 27 28 34 36; do
            src="legs/runtime-gate-api-$api/api-$api"
            [ -d "$src" ] && cp -a "$src" "$dir/api-$api"
          done
          {
            echo "run=${{ github.run_id }} sha=${GITHUB_SHA:0:7} date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for api in 26 27 28 34 36; do
              leg="$dir/api-$api/leg.txt"
              if [ -f "$leg" ]; then
                echo "api-$api $(head -n 1 "$leg") $(grep -E '^(system_image|webview|accel)=' "$leg" | tr '\n' ' ')"
                grep -E '^problem: ' "$leg" | sed "s/^/  api-$api /" || true
              else
                echo "api-$api verdict=missing (the leg left no evidence)"
              fi
            done
          } | tee "$dir/summary.txt"
          { echo '## Runtime gates'; echo '```'; cat "$dir/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the evidence back
        run: bash app/tool/ci/commit_gate_evidence.sh "${{ github.ref_name }}" app/ci-results/runtime-gates "runtime-gates evidence"

      - name: Enforce
        run: |
          failed=$(grep -E '^api-[0-9]+ ' app/ci-results/runtime-gates/summary.txt | grep -vc ' verdict=pass' || true)
          echo "legs not passed: $failed"
          [ "$failed" = "0" ]

  # The release build (Phase 5 W1, release.yml): a push whose subject line
  # carries [release] runs a dry run after this run's own build passed: an
  # arm64 App Bundle and APK signed with throwaway keys, every release check,
  # and the source archive. It publishes nothing. Publishing waits for a tag
  # trigger here, which stays off until the owner's keys exist and the owner
  # decides the first release (docs/BUILD_AND_RELEASE.md §4).
  release:
    name: Release (dry run)
    needs: quality-and-build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    uses: ./.github/workflows/release.yml
    with:
      dry_run: true
    secrets: inherit
