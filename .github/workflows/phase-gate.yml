name: Phase gate

# Full phase exit gate: emulator integration tests + process-death restore +
# cold-start measurement. Triggered by a commit message containing
# [phase-gate] (workflow_dispatch is unavailable until this file reaches the
# default branch).

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator-gate:
    name: Emulator gate (API 36)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[phase-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug
          # `flutter test integration_test` rebuilds app-debug.apk with the
          # test entrypoint, so keep the plain app aside.
          mkdir -p build/gate
          cp build/app/outputs/flutter-apk/app-debug.apk build/gate/app-plain-debug.apk

      # Cold start (G6) is timed on a release build for the emulator ABI; if
      # this step fails the gate falls back to the plain debug APK and says so
      # in ci-results/gate/perf.json.
      - name: Build release APK (x86_64, cold-start measurement)
        continue-on-error: true
        run: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk build/gate/app-release-x64.apk

      - name: Run emulator gate
        id: gate
        continue-on-error: true
        run: bash tool/ci/emulator_gate.sh

      # Key evidence also goes out as check-run annotations (readable via the
      # API) in case the commit-back below fails.
      - name: Evidence annotations
        if: always()
        continue-on-error: true
        run: bash tool/ci/annotate_gate_evidence.sh

      # Log/artifact download hosts are unreachable from the authoring
      # sandbox, so commit the gate evidence (app/ci-results/gate/) back.
      - name: Commit gate evidence back
        if: always()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: bash app/tool/ci/commit_gate_evidence.sh "${{ github.ref_name }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Phase gate results"
            echo '```'
            cat ci-results/gate/host.txt 2>/dev/null || true
            cat ci-results/gate/system-image.txt 2>/dev/null || true
            cat ci-results/gate/readiness.txt 2>/dev/null || true
            cat ci-results/gate/attempts.txt 2>/dev/null || true
            cat ci-results/gate/coldstart-summary.txt 2>/dev/null || true
            cat ci-results/gate/gate-result.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-gate-results
          path: app/ci-results/gate/
          if-no-files-found: ignore

      - name: Enforce gate
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "Emulator gate failed — see committed app/ci-results/gate/ evidence."
            exit 1
          fi
