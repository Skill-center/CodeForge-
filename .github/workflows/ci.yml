name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION_FILE: .flutter-version

jobs:
  editor:
    name: Editor page (TypeScript + CodeMirror 6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_COLOR: "1"
    defaults:
      run:
        working-directory: editor
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      # Same pattern as the Flutter job: each check records its output in
      # editor-results/ and may fail on its own, so one run reports every
      # problem; the Flutter job commits the results back in bootstrap mode.
      - name: Install from the lockfile
        id: install
        continue-on-error: true
        run: |
          mkdir -p ../editor-results
          { echo "node $(node --version), npm $(npm --version)"; npm ci --no-audit --no-fund; } 2>&1 | tee ../editor-results/install.txt

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee ../editor-results/typecheck.txt

      - name: Unit + contract tests (vitest)
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx vitest run 2>&1 | tee ../editor-results/test.txt

      - name: Licence gate (runtime packages)
        id: licenses
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node tool/check_licenses.mjs 2>&1 | tee ../editor-results/licenses.txt

      - name: Build the editor page
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node tool/build.mjs 2>&1 | tee ../editor-results/build.txt
          cp ../app/assets/editor/manifest.json ../editor-results/manifest.json

      - name: Verify the built page
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node tool/verify_bundle.mjs 2>&1 | tee ../editor-results/verify.txt

      - name: Upload editor results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-results
          path: editor-results/
          if-no-files-found: ignore

      - name: Upload editor page
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: editor-page
          path: app/assets/editor/
          if-no-files-found: error

      - name: Enforce editor gates
        if: always()
        run: |
          fail=0
          for gate in "install=${{ steps.install.outcome }}" "typecheck=${{ steps.typecheck.outcome }}" \
                      "tests=${{ steps.tests.outcome }}" "licenses=${{ steps.licenses.outcome }}" \
                      "build=${{ steps.build.outcome }}" "verify=${{ steps.verify.outcome }}"; do
            echo "$gate"
            [ "${gate#*=}" = "success" ] || fail=1
          done
          exit $fail

  quality-and-build:
    name: Quality gates + Android build
    # Runs after the editor job even when it fails, so a bootstrap run still
    # commits the editor results back.
    needs: editor
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter as .flutter-version pins it. flutter-action reads a version
      # file only as a pubspec (environment: flutter:) or an FVM file: given
      # .flutter-version it found no version and installed the latest
      # stable. That was the pinned 3.47.9 until Flutter 3.50.0 reached the
      # stable channel, whose minimum Android Gradle Plugin is above ours:
      # debug builds failed on the runners that got it (2026-11-11). The
      # file is read here and passed as the version, and the next step
      # fails if another Flutter was installed.
      - name: Read the Flutter pin
        id: flutter_pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < "$FLUTTER_VERSION_FILE")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version | tee "$RUNNER_TEMP/flutter-version.txt"
          actual=$(awk '/^Flutter / { print $2; exit }' "$RUNNER_TEMP/flutter-version.txt")
          want="${{ steps.flutter_pin.outputs.version }}"
          mkdir -p ci-results
          echo "flutter=$actual pinned=$want" | tee ci-results/flutter.txt
          echo "::notice title=Flutter::$actual (pinned: $want)"
          if [ "$actual" != "$want" ]; then
            echo "::error title=Flutter pin::Flutter $actual was installed; .flutter-version pins $want."
            exit 1
          fi

      # The editor page is built from editor/ and never committed
      # (docs/REPOSITORY_STRUCTURE.md): the app bundles exactly what the
      # editor job just built and verified. Without it the tests and the
      # build fail, so its absence is also reported as a gate of its own.
      - name: Fetch the editor page
        id: editor_page
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: editor-page
          path: app/assets/editor

      # Captured so a failed resolution still reaches the diagnostics
      # commit (bootstrap) and the job summary.
      - name: Resolve dependencies
        run: |
          mkdir -p ci-results
          flutter pub get 2>&1 | tee ci-results/pub-get.txt
          exit "${PIPESTATUS[0]}"

      # ── Bootstrap mode ────────────────────────────────────────────────
      # A commit whose message contains [bootstrap] asks CI to generate the
      # artifacts that cannot be produced in the authoring sandbox (no Dart
      # SDK there): pubspec.lock, generated code, dart fix/format results,
      # golden baselines. Results are committed back with [skip ci]; THIS run
      # then validates the fixed tree, so the run itself is the evidence.

      # Drift's database code, migration steps, schema dumps and migration-
      # test helpers (Phase 2 W5, ADR-0008), generated before fix + format.
      # make-migrations writes the steps file and the test helpers only once
      # a second schema version exists; `schema generate` writes the helpers
      # for every dumped version, the first included. Then Pigeon's Dart
      # client and Kotlin interface for the storage broker (Phase 3 W2,
      # pigeons/storage_api.dart). Every run regenerates all of it under
      # "Generated code check" and fails if the committed copies are stale.
      # Logged, and allowed to fail so the diagnostics commit still carries
      # what went wrong.
      - name: Bootstrap — generate code
        if: contains(github.event.head_commit.message, '[bootstrap]')
        continue-on-error: true
        run: |
          status=0
          {
            dart run build_runner build \
              && dart run drift_dev make-migrations \
              && dart run drift_dev schema generate drift_schemas/app/ \
                test/drift/app/generated/ \
              && dart run pigeon --input pigeons/storage_api.dart
          } > ci-results/codegen-bootstrap.txt 2>&1 || status=$?
          tail -40 ci-results/codegen-bootstrap.txt
          exit "$status"

      - name: Bootstrap — dart fix + format
        if: contains(github.event.head_commit.message, '[bootstrap]')
        run: |
          dart fix --apply
          dart format .

      - name: Bootstrap — commit lockfile + fixes back
        if: contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): bootstrap lockfile, fixes, format [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      - name: Bootstrap — generate golden baselines
        if: contains(github.event.head_commit.message, '[bootstrap]')
        # Only the golden suites (the full suite runs once, under Tests),
        # bounded so a hung test cannot hold the job until its timeout, and
        # logged so the diagnostics commit carries what happened.
        run: |
          mkdir -p ci-results
          status=0
          timeout --kill-after=30s 10m flutter test --update-goldens \
            --reporter expanded test/goldens > ci-results/goldens.txt 2>&1 \
            || status=$?
          echo "golden generation exited with status $status"

      - name: Bootstrap — commit goldens back
        if: contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): golden baselines [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      # ── Quality gates ─────────────────────────────────────────────────
      # Each gate captures its full output to ci-results/ and is allowed to
      # fail independently so a single run reports ALL problems. In bootstrap
      # mode the diagnostics are committed back (log download hosts are not
      # reachable from the authoring sandbox). A final step enforces the gates.
      - name: Prepare diagnostics dir
        run: mkdir -p ci-results

      - name: Fetch editor results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: editor-results
          path: app/ci-results/editor

      - name: Lockfile drift check
        id: lockfile
        continue-on-error: true
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock > ci-results/lockfile.txt 2>&1

      # Regenerates the Drift and Pigeon output exactly as bootstrap does
      # (generate, then the SDK formatter) and fails if a generator fails or
      # the committed copies differ — including a schema changed without a
      # new schema version, which make-migrations refuses.
      - name: Generated code check
        id: codegen
        continue-on-error: true
        run: |
          status=0
          {
            dart run build_runner build \
              && dart run drift_dev make-migrations \
              && dart run drift_dev schema generate drift_schemas/app/ \
                test/drift/app/generated/ \
              && dart run pigeon --input pigeons/storage_api.dart \
              && dart format $(find lib -name '*.g.dart' -o -name '*.steps.dart') \
                test/drift/app/generated
          } > ci-results/codegen.txt 2>&1 || status=$?
          generated=(-- '*.g.dart' '*.g.kt' '*.steps.dart' drift_schemas test/drift)
          {
            echo "--- generators exited with status $status"
            echo "--- generated files that differ from the commit:"
            git status --porcelain "${generated[@]}"
          } >> ci-results/codegen.txt
          tail -20 ci-results/codegen.txt
          [ "$status" -eq 0 ] && test -z "$(git status --porcelain "${generated[@]}")"

      - name: Format check
        id: format
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed . > ci-results/format.txt 2>&1

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze > ci-results/analyze.txt 2>&1

      - name: Architecture import lint
        id: imports
        continue-on-error: true
        run: dart run tool/lint_imports.dart > ci-results/imports.txt 2>&1

      - name: Dependency license gate
        id: licenses
        continue-on-error: true
        run: dart run tool/check_licenses.dart > ci-results/licenses.txt 2>&1

      - name: Tests (with coverage)
        id: tests
        continue-on-error: true
        # Bounded: a test that spins (where no per-test timeout can fire)
        # fails the gate in minutes, with the output up to that point.
        run: |
          timeout --kill-after=30s 15m flutter test --coverage \
            --reporter expanded > ci-results/test.txt 2>&1

      - name: Test digest
        if: steps.tests.outcome == 'failure'
        # Check-run annotations are readable through the API even where the
        # log hosts are not: carry the end of the test output there.
        run: |
          tail -n 40 ci-results/test.txt \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/digest.txt"
          echo "::warning title=Tests failed (last 40 lines)::$(cat "$RUNNER_TEMP/digest.txt")"

      # Golden diff images (Phase 3 W6, an owner item): a golden test that
      # failed left its golden, its own drawing and their differences in a
      # failures/ folder beside it. They move to ci-results/golden-failures/
      # (tool/ci/collect_golden_failures.sh) and are committed back with the
      # diagnostics, on any commit: the bootstrap commit-back takes them
      # with everything else, and "Commit golden failures back" below does
      # it for the others.
      - name: Collect golden failures
        id: golden_failures
        if: always()
        run: |
          count=$(bash tool/ci/collect_golden_failures.sh test ci-results)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "golden failure images: $count"
          if [ "$count" != "0" ]; then
            echo "::warning title=Golden failures::$count images in app/ci-results/golden-failures/ ($(paste -sd' ' ci-results/golden-failures.txt))"
          fi

      # The Gradle distribution: cached between runs, and fetched with
      # retries when the cache has none, because services.gradle.org stalls
      # now and then (app/tool/ci/fetch_gradle.sh). A failed fetch fails
      # the build below, which Enforce reports.
      - name: Restore the Gradle distribution
        id: gradle-dist
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch Gradle
        id: fetch-gradle
        continue-on-error: true
        run: bash tool/ci/fetch_gradle.sh > ci-results/gradle-fetch.txt 2>&1

      - name: Save the Gradle distribution
        if: >-
          steps.gradle-dist.outputs.cache-hit != 'true' &&
          steps.fetch-gradle.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: flutter build apk --debug > ci-results/build.txt 2>&1

      # The runner and, when the build failed, why: annotations are readable
      # through the API where the log hosts are not. Builds of commits that
      # changed only docs failed here on 2026-11-11 without a word of why,
      # until this digest showed Flutter 3.50.0 refusing our Android Gradle
      # Plugin (see "Read the Flutter pin").
      - name: Build digest
        if: always()
        run: |
          image="${ImageOS:-unknown} ${ImageVersion:-}"
          disk=$(df -h / | awk 'NR == 2 { print $4 " free of " $2 }')
          memory=$(free -m | awk '/^Mem:/ { print $7 " MiB available of " $2 }')
          echo "::notice title=Runner::image $image; disk $disk; memory $memory"
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            {
              echo "image $image; disk $disk; memory $memory"
              grep -n -A 12 -E 'What went wrong|No space left|Killed|OutOfMemory|FAILURE:' \
                ci-results/build.txt | head -n 30
              echo '--- the last 25 lines:'
              tail -n 25 ci-results/build.txt
            } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/build-digest.txt"
            echo "::warning title=Debug build failed::$(cat "$RUNNER_TEMP/build-digest.txt")"
          fi

      - name: APK checksum + size
        if: steps.build.outcome == 'success'
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c%s "$apk")
          {
            echo "apk_sha256=$sha"
            echo "apk_bytes=$size"
          } | tee ci-results/apk.txt
          {
            echo "apk_sha256=$sha"
            echo "apk_bytes=$size"
          } >> "$GITHUB_STEP_SUMMARY"

      # The merged manifest (Phase 3 W6, G8): no storage permission, and
      # ADR-0012's backup attributes (tool/ci/check_manifest.py, which first
      # shows itself catching each kind of drift). The debug manifest holds
      # everything the release one does, and the debug-only INTERNET.
      - name: Manifest check
        id: manifest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          status=0
          { python3 tool/ci/check_manifest.py --self-test \
              && python3 tool/ci/check_manifest.py build/app debug; } \
            > ci-results/manifest.txt 2>&1 || status=$?
          cat ci-results/manifest.txt
          exit "$status"

      # The host's Kotlin unit tests (src/test; Phase 3 W1: the backup
      # policy and its rules files). After the APK build, which wrote
      # android/local.properties and fetched what Gradle needs. The JUnit
      # counts go to ci-results and the summary, so no log download is
      # needed, and a run that found no tests fails.
      - name: Kotlin unit tests
        id: kotlin_tests
        continue-on-error: true
        run: |
          status=0
          ( cd android && timeout --kill-after=30s 15m \
              ./gradlew :app:testDebugUnitTest --console=plain ) \
            > ci-results/kotlin-tests.txt 2>&1 || status=$?
          tests=0; failures=0; errors=0
          for f in build/app/test-results/testDebugUnitTest/TEST-*.xml; do
            [ -f "$f" ] || continue
            head=$(grep -o '<testsuite [^>]*>' "$f" | head -n 1)
            t=$(printf '%s' "$head" | sed -n 's/.* tests="\([0-9]*\)".*/\1/p')
            fl=$(printf '%s' "$head" | sed -n 's/.* failures="\([0-9]*\)".*/\1/p')
            e=$(printf '%s' "$head" | sed -n 's/.* errors="\([0-9]*\)".*/\1/p')
            tests=$((tests + ${t:-0}))
            failures=$((failures + ${fl:-0}))
            errors=$((errors + ${e:-0}))
          done
          summary="kotlin_tests=$tests failures=$failures errors=$errors gradle_exit=$status"
          echo "$summary" | tee -a ci-results/kotlin-tests.txt >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] && [ "$tests" -gt 0 ] \
            && [ "$failures" -eq 0 ] && [ "$errors" -eq 0 ]

      - name: Kotlin digest
        if: steps.kotlin_tests.outcome == 'failure'
        run: |
          {
            df -h / | awk 'NR == 2 { print "disk " $4 " free of " $2 }'
            grep -n -A 12 -E 'What went wrong|No space left|FAILED' \
              ci-results/kotlin-tests.txt | head -n 30
            echo '--- the last 15 lines:'
            tail -n 15 ci-results/kotlin-tests.txt
          } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/kotlin-digest.txt"
          echo "::warning title=Kotlin unit tests failed::$(cat "$RUNNER_TEMP/kotlin-digest.txt")"

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            # Per-layer breakdown (first directory under lib/), so phase
            # targets such as "core/services >= 90%" are checkable.
            # Generated code (Drift's *.g.dart and *.steps.dart) is left out,
            # as it is for analysis: nobody writes it, and its unused
            # accessors would swamp the layer it lives in. The excluded line
            # count is printed so nothing disappears silently.
            awk -F'[:,]' '
              /^SF:/ { f = $2; gen = (f ~ /\.(g|steps)\.dart$/)
                       sub(/^.*lib\//, "", f); n = split(f, part, "/")
                       layer = (n > 1) ? part[1] : "(root)"; next }
              /^DA:/ { if (gen) { excluded++; next }
                       total[layer]++; all++
                       if ($3 > 0) { hit[layer]++; allhit++ } }
              END { printf "line_coverage=%d/%d\n", allhit, all
                    printf "generated_lines_excluded=%d\n", excluded
                    fflush()
                    for (l in total)
                      printf "layer_coverage %s=%d/%d (%.1f%%)\n", l, hit[l], total[l], 100 * hit[l] / total[l] | "sort" }
            ' coverage/lcov.info > ci-results/coverage.txt
            cat ci-results/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Commit diagnostics back (bootstrap only) ──────────────────────
      - name: Commit diagnostics back
        if: always() && contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          # Also set here: the earlier commit-back steps may not have run.
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): gate diagnostics [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      # A commit without [bootstrap] commits nothing back, except the images
      # of golden tests that failed, with the diagnostics they belong to.
      - name: Commit golden failures back
        if: >-
          always() && steps.golden_failures.outputs.count != '' &&
          steps.golden_failures.outputs.count != '0' &&
          !contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A app/ci-results
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): golden failure images [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore

      - name: Enforce quality gates
        if: always()
        run: |
          fail=0
          for gate in editor_page lockfile codegen format analyze imports licenses tests build manifest kotlin_tests; do
            case "$gate" in
              editor_page) outcome="${{ steps.editor_page.outcome }}" ;;
              lockfile) outcome="${{ steps.lockfile.outcome }}" ;;
              codegen) outcome="${{ steps.codegen.outcome }}" ;;
              format) outcome="${{ steps.format.outcome }}" ;;
              analyze) outcome="${{ steps.analyze.outcome }}" ;;
              imports) outcome="${{ steps.imports.outcome }}" ;;
              licenses) outcome="${{ steps.licenses.outcome }}" ;;
              tests) outcome="${{ steps.tests.outcome }}" ;;
              build) outcome="${{ steps.build.outcome }}" ;;
              manifest) outcome="${{ steps.manifest.outcome }}" ;;
              kotlin_tests) outcome="${{ steps.kotlin_tests.outcome }}" ;;
            esac
            echo "$gate: $outcome"
            [ "$outcome" = "success" ] || fail=1
          done
          exit $fail
