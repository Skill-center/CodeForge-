name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION_FILE: .flutter-version

jobs:
  editor:
    name: Editor page (TypeScript + CodeMirror 6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_COLOR: "1"
    defaults:
      run:
        working-directory: editor
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      # Same pattern as the Flutter job: each check records its output in
      # editor-results/ and may fail on its own, so one run reports every
      # problem; the Flutter job commits the results back in bootstrap mode.
      - name: Install from the lockfile
        id: install
        continue-on-error: true
        run: |
          mkdir -p ../editor-results
          { echo "node $(node --version), npm $(npm --version)"; npm ci --no-audit --no-fund; } 2>&1 | tee ../editor-results/install.txt

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee ../editor-results/typecheck.txt

      - name: Unit + contract tests (vitest)
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx vitest run 2>&1 | tee ../editor-results/test.txt

      - name: Licence gate (runtime packages)
        id: licenses
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node tool/check_licenses.mjs 2>&1 | tee ../editor-results/licenses.txt

      - name: Build the editor page
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node tool/build.mjs 2>&1 | tee ../editor-results/build.txt
          cp ../app/assets/editor/manifest.json ../editor-results/manifest.json

      - name: Verify the built page
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node tool/verify_bundle.mjs 2>&1 | tee ../editor-results/verify.txt

      - name: Upload editor results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-results
          path: editor-results/
          if-no-files-found: ignore

      - name: Upload editor page
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: editor-page
          path: app/assets/editor/
          if-no-files-found: error

      - name: Enforce editor gates
        if: always()
        run: |
          fail=0
          for gate in "install=${{ steps.install.outcome }}" "typecheck=${{ steps.typecheck.outcome }}" \
                      "tests=${{ steps.tests.outcome }}" "licenses=${{ steps.licenses.outcome }}" \
                      "build=${{ steps.build.outcome }}" "verify=${{ steps.verify.outcome }}"; do
            echo "$gate"
            [ "${gate#*=}" = "success" ] || fail=1
          done
          exit $fail

  quality-and-build:
    name: Quality gates + Android build
    # Runs after the editor job even when it fails, so a bootstrap run still
    # commits the editor results back.
    needs: editor
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.FLUTTER_VERSION_FILE }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # ── Bootstrap mode ────────────────────────────────────────────────
      # A commit whose message contains [bootstrap] asks CI to generate the
      # artifacts that cannot be produced in the authoring sandbox (no Dart
      # SDK there): pubspec.lock, dart fix/format results, golden baselines.
      # Results are committed back with [skip ci]; THIS run then validates
      # the fixed tree, so the run itself is the evidence.
      - name: Bootstrap — dart fix + format
        if: contains(github.event.head_commit.message, '[bootstrap]')
        run: |
          dart fix --apply
          dart format .

      - name: Bootstrap — commit lockfile + fixes back
        if: contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): bootstrap lockfile, fixes, format [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      - name: Bootstrap — generate golden baselines
        if: contains(github.event.head_commit.message, '[bootstrap]')
        run: flutter test --update-goldens || true

      - name: Bootstrap — commit goldens back
        if: contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): golden baselines [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      # ── Quality gates ─────────────────────────────────────────────────
      # Each gate captures its full output to ci-results/ and is allowed to
      # fail independently so a single run reports ALL problems. In bootstrap
      # mode the diagnostics are committed back (log download hosts are not
      # reachable from the authoring sandbox). A final step enforces the gates.
      - name: Prepare diagnostics dir
        run: mkdir -p ci-results

      - name: Fetch editor results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: editor-results
          path: app/ci-results/editor

      - name: Lockfile drift check
        id: lockfile
        continue-on-error: true
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock > ci-results/lockfile.txt 2>&1

      - name: Format check
        id: format
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed . > ci-results/format.txt 2>&1

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze > ci-results/analyze.txt 2>&1

      - name: Architecture import lint
        id: imports
        continue-on-error: true
        run: dart run tool/lint_imports.dart > ci-results/imports.txt 2>&1

      - name: Dependency license gate
        id: licenses
        continue-on-error: true
        run: dart run tool/check_licenses.dart > ci-results/licenses.txt 2>&1

      - name: Tests (with coverage)
        id: tests
        continue-on-error: true
        run: flutter test --coverage --reporter expanded > ci-results/test.txt 2>&1

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: flutter build apk --debug > ci-results/build.txt 2>&1

      - name: APK checksum + size
        if: steps.build.outcome == 'success'
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c%s "$apk")
          {
            echo "apk_sha256=$sha"
            echo "apk_bytes=$size"
          } | tee ci-results/apk.txt
          {
            echo "apk_sha256=$sha"
            echo "apk_bytes=$size"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            total=$(grep -c '^DA:' coverage/lcov.info || true)
            hit=$(awk -F, '/^DA:/ && $2 > 0' coverage/lcov.info | wc -l)
            echo "Line coverage: $hit/$total" >> "$GITHUB_STEP_SUMMARY"
            echo "line_coverage=$hit/$total" > ci-results/coverage.txt
            # Per-layer breakdown (first directory under lib/), so phase
            # targets such as "core/services >= 90%" are checkable.
            awk -F'[:,]' '
              /^SF:/ { f = $2; sub(/^.*lib\//, "", f); n = split(f, part, "/")
                       layer = (n > 1) ? part[1] : "(root)"; next }
              /^DA:/ { total[layer]++; if ($3 > 0) hit[layer]++ }
              END { for (l in total)
                      printf "layer_coverage %s=%d/%d (%.1f%%)\n", l, hit[l], total[l], 100 * hit[l] / total[l] }
            ' coverage/lcov.info | sort | tee -a ci-results/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Commit diagnostics back (bootstrap only) ──────────────────────
      - name: Commit diagnostics back
        if: always() && contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): gate diagnostics [skip ci]"
            bash app/tool/ci/push_with_retry.sh "${{ github.ref_name }}"
          fi

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore

      - name: Enforce quality gates
        if: always()
        run: |
          fail=0
          for gate in lockfile format analyze imports licenses tests build; do
            case "$gate" in
              lockfile) outcome="${{ steps.lockfile.outcome }}" ;;
              format) outcome="${{ steps.format.outcome }}" ;;
              analyze) outcome="${{ steps.analyze.outcome }}" ;;
              imports) outcome="${{ steps.imports.outcome }}" ;;
              licenses) outcome="${{ steps.licenses.outcome }}" ;;
              tests) outcome="${{ steps.tests.outcome }}" ;;
              build) outcome="${{ steps.build.outcome }}" ;;
            esac
            echo "$gate: $outcome"
            [ "$outcome" = "success" ] || fail=1
          done
          exit $fail
