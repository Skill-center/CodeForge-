name: Phase gate

# Full phase exit gate: emulator integration tests + process-death restore +
# cold-start measurement. Triggered by a commit message containing
# [phase-gate] (workflow_dispatch is unavailable until this file reaches the
# default branch).

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator-gate:
    name: Emulator gate (API 36)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[phase-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter as .flutter-version pins it: read here and passed as the
      # version, since flutter-action reads a version file only as a
      # pubspec or an FVM file (ci.yml says more).
      - name: Read the Flutter pin
        id: flutter_pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version | tee "$RUNNER_TEMP/flutter-version.txt"
          actual=$(awk '/^Flutter / { print $2; exit }' "$RUNNER_TEMP/flutter-version.txt")
          want="${{ steps.flutter_pin.outputs.version }}"
          echo "::notice title=Flutter::$actual (pinned: $want)"
          if [ "$actual" != "$want" ]; then
            echo "::error title=Flutter pin::Flutter $actual was installed; .flutter-version pins $want."
            exit 1
          fi

      # The editor page is built from editor/ and never committed. This
      # workflow cannot see the CI run's artifact, so it builds the page from
      # the same lockfile (the build is reproducible: same bytes, same hash)
      # and verifies it before the APK bundles it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build the editor page
        working-directory: editor
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run verify

      - name: Resolve dependencies
        run: flutter pub get

      # Drift's generated database code (Phase 2 W5) and the storage
      # broker's Pigeon API (Phase 3 W2). The gate builds the pushed commit,
      # which on a [bootstrap] push predates CI's commit-back of the
      # generated files; on later commits this reproduces them.
      - name: Generate code
        run: |
          dart run build_runner build
          dart run pigeon --input pigeons/storage_api.dart

      # The Gradle distribution: cached between runs, and fetched with
      # retries when the cache has none, because services.gradle.org stalls
      # now and then (app/tool/ci/fetch_gradle.sh). Saved right after the
      # fetch, since a cache saved at the end of the job needs the whole
      # gate to pass.
      - name: Restore the Gradle distribution
        id: gradle-dist
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch Gradle
        run: bash tool/ci/fetch_gradle.sh

      - name: Save the Gradle distribution
        if: steps.gradle-dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug APK
        run: |
          flutter build apk --debug
          # `flutter test integration_test` rebuilds app-debug.apk with the
          # test entrypoint, so keep the plain app aside.
          mkdir -p build/gate
          cp build/app/outputs/flutter-apk/app-debug.apk build/gate/app-plain-debug.apk

      # Cold start (G6) is timed on a release build for the emulator ABI; if
      # this step fails the gate falls back to the plain debug APK and says so
      # in ci-results/gate/perf.json.
      - name: Build release APK (x86_64, cold-start measurement)
        continue-on-error: true
        run: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk build/gate/app-release-x64.apk

      # The same release APK rendering with Skia, for the cold-start group to
      # time beside the shipped one (Phase 3 W6: Impeller's first gate timed
      # cold start at 1688 ms, against 755-1372 ms on Skia in earlier gates).
      # The manifest gets Flutter's opt-out for this build only, and is put
      # back at once. Never shipped.
      - name: Build release APK with Skia (x86_64, cold-start comparison)
        continue-on-error: true
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          cp "$manifest" "$RUNNER_TEMP/AndroidManifest.xml"
          status=0
          python3 tool/ci/skia_manifest.py "$manifest" \
            && flutter build apk --release --target-platform android-x64 \
            && cp build/app/outputs/flutter-apk/app-release.apk \
                 build/gate/app-release-x64-skia.apk || status=$?
          cp "$RUNNER_TEMP/AndroidManifest.xml" "$manifest"
          git diff --exit-code -- "$manifest"
          exit "$status"

      # Phase 2 W3 engine benchmark pages (CodeMirror 6 + Monaco), built only
      # now: the release APK above stays free of them, while the phone APK
      # and the integration tests below (which rebuild the debug APK) bundle
      # them.
      - name: Build the editor benchmark pages
        working-directory: editor
        run: npm run build:bench

      # The phone test build: profile mode (optimised like release, but
      # debug-signed and with Settings → Developer), arm64, benchmark pages
      # inside. Uploaded below as codeforge-phone-profile-arm64.
      - name: Build phone APK (profile, arm64)
        continue-on-error: true
        run: |
          flutter build apk --profile --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-profile.apk build/gate/codeforge-phone-profile-arm64.apk
          sha256sum build/gate/codeforge-phone-profile-arm64.apk

      - name: Run emulator gate
        id: gate
        continue-on-error: true
        run: bash tool/ci/emulator_gate.sh

      # Key evidence also goes out as check-run annotations (readable via the
      # API) in case the commit-back below fails.
      - name: Evidence annotations
        if: always()
        continue-on-error: true
        run: bash tool/ci/annotate_gate_evidence.sh

      # Log/artifact download hosts are unreachable from the authoring
      # sandbox, so commit the gate evidence (app/ci-results/gate/) back.
      - name: Commit gate evidence back
        if: always()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: bash app/tool/ci/commit_gate_evidence.sh "${{ github.ref_name }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Phase gate results"
            echo '```'
            cat ci-results/gate/host.txt 2>/dev/null || true
            cat ci-results/gate/system-image.txt 2>/dev/null || true
            cat ci-results/gate/readiness.txt 2>/dev/null || true
            cat ci-results/gate/attempts.txt 2>/dev/null || true
            cat ci-results/gate/coldstart-summary.txt 2>/dev/null || true
            cat ci-results/gate/editor_bench.txt 2>/dev/null || true
            cat ci-results/gate/large_files.txt 2>/dev/null || true
            cat ci-results/gate/backup.txt 2>/dev/null || true
            cat ci-results/gate/folders.txt 2>/dev/null || true
            cat ci-results/gate/explorer.txt 2>/dev/null || true
            cat ci-results/gate/watch.txt 2>/dev/null || true
            cat ci-results/gate/measure.txt 2>/dev/null || true
            cat ci-results/gate/gate-result.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-gate-results
          path: app/ci-results/gate/
          if-no-files-found: ignore

      - name: Upload phone APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-phone-profile-arm64
          path: app/build/gate/codeforge-phone-profile-arm64.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce gate
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "Emulator gate failed — see committed app/ci-results/gate/ evidence."
            exit 1
          fi
