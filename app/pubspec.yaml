name: codeforge
description: "CodeForge — a premium, mobile-first Android development environment."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0-0

# Dependency policy: docs/TECH_STACK.md §4 — exact pins, committed lockfile,
# justification required for every addition. Versions verified 2026-11-05.
dependencies:
  flutter:
    sdk: flutter
  # State management + DI (ADR-0003). Compile-safe reactive controllers.
  flutter_riverpod: 3.4.3
  # Declarative routing with deep links + restoration (ADR-0003).
  go_router: 18.1.3
  # Settings persistence only; structured state moves to Drift in Phase 2 (ADR-0008).
  shared_preferences: 2.5.6
  # SHA-256 check of the bundled editor page against its manifest before it
  # runs (docs/SECURITY.md §3). It was already locked as a transitive
  # dependency; declared at the locked version now that lib/ imports it.
  crypto: 3.0.8
  # Hosts the editor page (ADR-0004, docs/EDITOR_ARCHITECTURE.md): the
  # Flutter team's WebView plugin, Android implementation pinned alongside
  # because the host hardens the WebView through its Android-only API
  # (file/content access off, debugging only in debug builds).
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
    # The editor page, built from editor/ (never committed): CI builds it in
    # the editor job; locally run `npm ci && npm run build` in editor/.
    - assets/editor/editor.html
    - assets/editor/manifest.json
    - assets/editor/NOTICES.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono_400Regular_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/JetBrainsMono_500Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono_700Bold.ttf
          weight: 700
