name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION_FILE: .flutter-version

jobs:
  quality-and-build:
    name: Quality gates + Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.FLUTTER_VERSION_FILE }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # ── Bootstrap mode ────────────────────────────────────────────────
      # A commit whose message contains [bootstrap] asks CI to generate the
      # artifacts that cannot be produced in the authoring sandbox (no Dart
      # SDK there): pubspec.lock, dart fix/format results, golden baselines.
      # Results are committed back with [skip ci]; THIS run then validates
      # the fixed tree, so the run itself is the evidence.
      - name: Bootstrap — dart fix + format
        if: contains(github.event.head_commit.message, '[bootstrap]')
        run: |
          dart fix --apply
          dart format .

      - name: Bootstrap — commit lockfile + fixes back
        if: contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "codeforge-ci"
          git config user.email "ci@codeforge.invalid"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): bootstrap lockfile, fixes, format [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Bootstrap — generate golden baselines
        if: contains(github.event.head_commit.message, '[bootstrap]')
        run: flutter test --update-goldens || true

      - name: Bootstrap — commit goldens back
        if: contains(github.event.head_commit.message, '[bootstrap]')
        working-directory: ${{ github.workspace }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): golden baselines [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ── Quality gates (always) ────────────────────────────────────────
      - name: Lockfile drift check
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Architecture import lint
        run: dart run tool/lint_imports.dart

      - name: Dependency license gate
        run: dart run tool/check_licenses.dart

      - name: Tests (with coverage)
        run: flutter test --coverage --reporter expanded

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            total=$(grep -c '^DA:' coverage/lcov.info || true)
            hit=$(awk -F, '/^DA:/ && $2 > 0' coverage/lcov.info | wc -l)
            echo "Line coverage: $hit/$total" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Android build (G1) ────────────────────────────────────────────
      - name: Build debug APK
        run: flutter build apk --debug

      - name: APK checksum + size
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c%s "$apk")
          echo "apk_sha256=$sha" >> "$GITHUB_STEP_SUMMARY"
          echo "apk_bytes=$size" >> "$GITHUB_STEP_SUMMARY"
          echo "APK sha256: $sha"
          echo "APK size: $size bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore
